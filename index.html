var detailKey=null;
function detailOeffnen(key){
  detailKey=key;
  document.getElementById("backdrop").className="an";
  document.getElementById("detail").className="an";
  detailZeichnen();
}
function detailSchliessen(still){
  var war=detailKey;
  detailKey=null;
  var d=document.getElementById("detail"), b=document.getElementById("backdrop");
  if(d) d.className=""; if(b) b.className="";
  if(!still && war && ansicht.seite==="info" && ansicht.reiter==="monat") zeichneMonat();
}
function rz(k,v,cls){ return '<tr class="'+(cls||"")+'"><td>'+k+'</td><td>'+v+'</td></tr>'; }
function ivBlock(typ,titel,kurz,t){
  var liste=[];
  (t.intervalle||[]).forEach(function(x,i){ if(x.typ===typ) liste.push({x:x,i:i}); });
  var h='<h3>'+esc(titel)+'</h3><div class="ivliste">';
  if(!liste.length) h+='<p class="hint" style="margin:0">Keine Buchung.</p>';
  liste.forEach(function(o){
    h+='<div class="ivzeile">'
      +'<input class="t" type="text" inputmode="numeric" data-iv="'+o.i+'" data-teil="von" value="'+esc(o.x.von||"")+'" placeholder="––:––" aria-label="Beginn">'
      +'<span class="bis">bis</span>'
      +'<input class="t" type="text" inputmode="numeric" data-iv="'+o.i+'" data-teil="bis" value="'+esc(o.x.bis||"")+'" placeholder="offen" aria-label="Ende">'
      +'<button class="del" data-ivdel="'+o.i+'" aria-label="Zeile löschen">✕</button></div>';
  });
  return h+'</div><button class="addbtn" data-ivadd="'+typ+'">+ '+esc(kurz)+' hinzufügen</button>';
}
function detailZeichnen(){
  var key=detailKey; if(!key) return;
  var r=tagRechnung(key);
  var t=state.tage[key]||{intervalle:[],korrekturen:[],notiz:""};
  var h='<div class="dkopf">'
   +'<div><div class="dt">'+esc(WT_LANG[r.dow])+', '+esc(fmtDatum(key))+'</div>'
   +'<div class="ds">'+(r.feiertag?esc(r.feiertag)+' · ':'')+'Tagessoll '+fmtDauer(r.tagessoll)+' h</div></div>'
   +'<button class="iconbtn" id="dClose" style="margin-left:auto" aria-label="Schließen">✕</button></div><div class="dbody">';
  if(r.vorStichtag)
    h+='<ul class="hinweise" style="margin-bottom:14px"><li class="i"><span class="sym">i</span><span>Dieser Tag liegt vor dem Stichtag ('
      +esc(fmtDatum(E().stichtag))+') und zählt weder ins Zeitkonto noch in die Monatssumme.</span></li></ul>';

  h+='<div class="feld"><label for="dArt">Tagesart</label><select id="dArt">';
  ART_REIHE.forEach(function(a){
    h+='<option value="'+a+'"'+(a===r.art?' selected':'')+'>'+esc(ARTEN[a].name)+(a===r.autoArt?' (automatisch)':'')+'</option>';
  });
  h+='</select>'+(r.artManuell?'<div class="sub">Manuell gesetzt. <button class="btn" id="dArtReset" style="min-height:34px;padding:0 9px;margin-top:6px">Auf „'+esc(ARTEN[r.autoArt].name)+'“ zurücksetzen</button></div>':'')+'</div>';

  h+=ivBlock("arbeit","Arbeitszeit (Kommen – Gehen)","Arbeitszeit",t);
  h+=ivBlock("pause","Pausen","Pause",t);
  h+=ivBlock("dienstgang","Dienstgänge","Dienstgang",t);
  h+=ivBlock("privat","Private Unterbrechungen","private Unterbrechung",t);

  h+='<h3>Sonstige Ergänzungen</h3>'
   +'<p class="hint" style="margin-bottom:6px">Zeitkorrekturen in Minuten mit Begründung — z. B. „Sitzung Stadtrat, 90 Min“, „Dienstreise vom Wohnort angetreten“, „vergessene Gehen-Buchung“. Negative Werte ziehen Zeit ab.</p>'
   +'<div class="ivliste">';
  (t.korrekturen||[]).forEach(function(k,i){
    var fehlt = k.min && !k.grund;
    h+='<div class="ivzeile"><input class="z" type="text" inputmode="numeric" data-korr="'+i+'" data-teil="min" value="'+esc(k.min)+'" aria-label="Minuten">'
      +'<input class="g" type="text" data-korr="'+i+'" data-teil="grund" value="'+esc(k.grund||"")+'" placeholder="Begründung (Pflicht)" aria-label="Begründung"'
      +(fehlt?' style="border-color:var(--warn)"':'')+'>'
      +'<button class="del" data-korrdel="'+i+'" aria-label="Korrektur löschen">✕</button></div>';
  });
  h+='</div><button class="addbtn" id="korrAdd">+ Zeitkorrektur hinzufügen</button>';

  h+='<div class="feld" style="margin-top:18px"><label for="dNotiz">Notiz</label><textarea id="dNotiz" placeholder="Freitext für diesen Tag">'+esc(t.notiz||"")+'</textarea></div>';

  h+='<h3>Berechnung im Einzelnen</h3><table class="rechnung">'
   +rz("Arbeitsintervalle (Kommen → Gehen)", fmtDauer(r.arbeitSumme)+" h")
   +(r.dienstgangSumme?rz("Dienstgänge gesamt", fmtDauer(r.dienstgangSumme)+" h","zwi"):"")
   +(r.dienstgangSumme?rz("davon außerhalb der Anwesenheit (+)", fmtDauer(r.dienstgangAussen)+" h","zwi"):"")
   +(r.korrektur?rz("Zeitkorrekturen", fmtSaldo(r.korrektur)+" h"):"")
   +(r.privat?rz("private Unterbrechungen (−)", "−"+fmtDauer(r.privat)+" h"):"")
   +rz("<strong>Brutto-Anwesenheit</strong>", "<strong>"+fmtDauer(r.brutto)+" h</strong>")
   +(r.pauseAutomatisch
      ? rz("Mindestpause § 4 ArbZG — automatisch abgezogen, da keine Pause gestempelt", fmtDauer(r.pflichtPause)+" h","zwi")
      : rz("gestempelte Pause", fmtDauer(r.gebuchtePause)+" h","zwi")
        +rz("Mindestpause nach § 4 ArbZG", fmtDauer(r.pflichtPause)+" h","zwi"))
   +(r.zuschlag?rz("Verspätungszuschlag ("+esc(r.zuschlagInfo)+")", "+"+fmtDauer(r.zuschlag)+" h","zwi"):"")
   +rz("<strong>Pausenabzug gesamt (−)</strong>", "<strong>−"+fmtDauer(r.abzug)+" h</strong>")
   +(r.gekappt?rz("über "+fmtDauer(E().kappung)+" h gekappt (−)", "−"+fmtDauer(r.gekappt)+" h"):"")
   +(r.gutschrift?rz("Gutschrift "+esc(r.artName), fmtDauer(r.gutschrift)+" h"):"")
   +rz("<strong>Ist</strong>", "<strong>"+fmtDauer(r.ist)+" h</strong>","sum")
   +rz("Soll", fmtDauer(r.soll)+" h")
   +rz("<strong>Saldo</strong>", '<strong class="'+(r.saldo>0?"p":r.saldo<0?"m":"")+'">'+fmtSaldo(r.saldo)+" h</strong>","sum")
   +'</table>';

  if(r.warnungen.length){
    h+='<h3>Hinweise</h3><ul class="hinweise">';
    r.warnungen.forEach(function(x){ h+='<li class="'+(x.typ==="warn"?"w":"i")+'"><span class="sym">'+(x.typ==="warn"?"!":"i")+'</span><span>'+esc(x.text)+'</span></li>'; });
    h+='</ul>';
  }
  h+='<div class="knopfreihe" style="margin-top:20px">'
   +'<button class="btn prim" id="dFertig" style="flex:1;min-height:52px">Fertig</button>'
   +'<button class="btn gefahr" id="dLeeren" style="min-height:52px">Tag leeren</button></div></div>';

  document.getElementById("detail").innerHTML=h;
  detailEvents();
}
function detailEvents(){
  var d=document.getElementById("detail"), key=detailKey;
  var alle=function(sel,fn){ var xs=d.querySelectorAll(sel); for(var i=0;i<xs.length;i++) fn(xs[i]); };
  document.getElementById("dClose").addEventListener("click",function(){ detailSchliessen(); });
  document.getElementById("dFertig").addEventListener("click",function(){ detailSchliessen(); });
  document.getElementById("backdrop").onclick=function(){ detailSchliessen(); };
  document.getElementById("dArt").addEventListener("change",function(){
    var t=tagObj(key,true); t.art=this.value; aufraeumen(key); speichern(); detailZeichnen();
  });
  var ar=document.getElementById("dArtReset");
  if(ar) ar.addEventListener("click",function(){ var t=tagObj(key,true); delete t.art; aufraeumen(key); speichern(); detailZeichnen(); });
  document.getElementById("dNotiz").addEventListener("change",function(){
    var t=tagObj(key,true); t.notiz=this.value.trim(); aufraeumen(key); speichern();
  });
  document.getElementById("dLeeren").addEventListener("click",function(){
    if(!window.confirm("Alle Buchungen, Korrekturen und Notizen dieses Tages löschen?")) return;
    delete state.tage[key]; speichern(); detailZeichnen();
  });
  alle("[data-ivadd]",function(b){
    b.addEventListener("click",function(){
      var t=tagObj(key,true);
      t.intervalle.push({typ:b.getAttribute("data-ivadd"),von:"",bis:""});
      speichern(); detailZeichnen();
      var f=d.querySelectorAll('input[data-teil="von"]');
      if(f.length) f[f.length-1].focus();
    });
  });
  alle("[data-ivdel]",function(b){
    b.addEventListener("click",function(){
      var t=tagObj(key,true); t.intervalle.splice(+b.getAttribute("data-ivdel"),1);
      aufraeumen(key); speichern(); detailZeichnen();
    });
  });
  alle("input[data-iv]",function(el){
    el.addEventListener("change",function(){
      var t=tagObj(key,true), i=+el.getAttribute("data-iv"), teil=el.getAttribute("data-teil");
      var roh=el.value.trim();
      if(roh===""){ t.intervalle[i][teil]= (teil==="bis"?null:""); }
      else{
        var m=parseZeit(roh);
        if(m===null){ el.value=t.intervalle[i][teil]||""; return; }
        t.intervalle[i][teil]=fmtUhr(m);
      }
      speichern(); detailZeichnen();
    });
  });
  document.getElementById("korrAdd").addEventListener("click",function(){
    var t=tagObj(key,true); t.korrekturen.push({min:0,grund:""}); speichern(); detailZeichnen();
    var f=d.querySelectorAll('input[data-teil="min"]'); if(f.length) f[f.length-1].focus();
  });
  alle("[data-korrdel]",function(b){
    b.addEventListener("click",function(){
      var t=tagObj(key,true); t.korrekturen.splice(+b.getAttribute("data-korrdel"),1);
      aufraeumen(key); speichern(); detailZeichnen();
    });
  });
  alle("input[data-korr]",function(el){
    el.addEventListener("change",function(){
      var t=tagObj(key,true), i=+el.getAttribute("data-korr"), teil=el.getAttribute("data-teil");
      if(teil==="min"){
        var v=parseInt(String(el.value).replace(/[^\-0-9]/g,""),10);
        t.korrekturen[i].min = isFinite(v)?v:0;
      } else t.korrekturen[i].grund=el.value.trim();
      speichern(); detailZeichnen();
    });
  });
}

function einstellungenEvents(){
  var e=E();
  var g=function(id){ return document.getElementById(id); };
  var alle=function(sel,fn){ var xs=document.querySelectorAll(sel); for(var i=0;i<xs.length;i++) fn(xs[i]); };
  function fertig(neuzeichnen){ speichern(); themeAnwenden(); if(neuzeichnen!==false) zeichneEinstellungen(); }

  alle('input[name="waz"]',function(r){
    r.addEventListener("change",function(){ if(r.value!=="frei") e.wochenarbeitszeit=parseInt(r.value,10); fertig(); });
  });
  g("wazFrei").addEventListener("change",function(){
    var v=parseDauer(this.value); if(v!==null&&v>0&&v<=7*1440) e.wochenarbeitszeit=v; fertig();
  });
  alle("[data-at]",function(c){
    c.addEventListener("change",function(){ e.arbeitstage[+c.getAttribute("data-at")]=c.checked; fertig(); });
  });
  g("tsAuto").addEventListener("change",function(){
    e.tagessollAuto=this.checked;
    if(!e.tagessollAuto) e.tagessoll=tagessollBerechnet(e);
    fertig();
  });
  g("tsWert").addEventListener("change",function(){ var v=parseDauer(this.value); if(v!==null&&v>=0) e.tagessoll=v; fertig(); });
  g("rahmenAn").addEventListener("change",function(){ e.rahmenPruefung=this.checked; fertig(false); });
  g("rahmenVon").addEventListener("change",function(){ var v=parseZeit(this.value); if(v!==null) e.rahmenVon=fmtUhr(v); fertig(); });
  g("rahmenBis").addEventListener("change",function(){ var v=parseZeit(this.value); if(v!==null) e.rahmenBis=fmtUhr(v); fertig(); });
  g("kernAn").addEventListener("change",function(){ e.kernzeitPruefung=this.checked; fertig(false); });
  alle("[data-kern]",function(el){
    el.addEventListener("change",function(){
      var d=+el.getAttribute("data-kern"), j=+el.getAttribute("data-j"), teil=el.getAttribute("data-teil");
      var v=parseZeit(el.value);
      if(v!==null) e.kernzeiten[String(d)][j][teil]=fmtUhr(v);
      fertig();
    });
  });
  alle("[data-kerndel]",function(b){

/* =========================================================================
   Export / Import
   ========================================================================= */
function download(name,inhalt,typ){
  var b=new Blob([inhalt],{type:typ||"application/octet-stream"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.parentNode.removeChild(a); },800);
}
function jsonExport(){
  download("zeiterfassung-sicherung-"+heuteKey()+".json", JSON.stringify(state,null,2), "application/json");
}
function jsonImport(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  var box=document.getElementById("impVorschau");
  var leser=new FileReader();
  leser.onload=function(){
    var p=null;
    try{ p=JSON.parse(leser.result); }
    catch(err){
      box.innerHTML='<ul class="hinweise" style="margin-top:12px"><li class="w"><span class="sym">!</span><span>Die Datei ist kein gültiges JSON.</span></li></ul>';
      return;
    }
    if(!p||typeof p!=="object"||!p.tage){
      box.innerHTML='<ul class="hinweise" style="margin-top:12px"><li class="w"><span class="sym">!</span><span>Die Datei enthält keinen Zeiterfassungs-Bestand.</span></li></ul>';
      return;
    }
    var keys=Object.keys(p.tage).sort(), n=keys.length;
    box.innerHTML='<div class="karte pad" style="margin-top:12px;background:var(--surface2)">'
      +'<div class="label">Vorschau des Imports</div>'
      +'<p style="margin:0 0 6px">Die Datei <strong>'+esc(f.name)+'</strong> enthält <strong>'+n+'</strong> Tage'
      +(n?' ('+esc(fmtDatum(keys[0]))+' bis '+esc(fmtDatum(keys[n-1]))+')':'')
      +(p.einstellungen?' und ein vollständiges Einstellungsprofil':'')+'.</p>'
      +'<p class="hint">Der Import <strong>überschreibt</strong> den aktuellen Bestand ('+Object.keys(state.tage).length+' Tage) vollständig.</p>'
      +'<div class="knopfreihe" style="margin-top:10px"><button class="btn prim" id="impOk">Jetzt überschreiben</button>'
      +'<button class="btn" id="impAbbruch">Abbrechen</button></div></div>';
    document.getElementById("impOk").addEventListener("click",function(){
      if(!window.confirm("Aktuellen Bestand durch die Importdatei ersetzen?")) return;
      var s=leererState();
      s.tage=p.tage||{};
      var std=standardEinstellungen();
      for(var k in std) if(p.einstellungen&&p.einstellungen[k]!==undefined) std[k]=p.einstellungen[k];
      s.einstellungen=std;
      state=s; speichern(); themeAnwenden(); zeichneEinstellungen();
      window.alert("Import abgeschlossen: "+n+" Tage übernommen.");
    });
    document.getElementById("impAbbruch").addEventListener("click",function(){ box.innerHTML=""; });
  };
  leser.readAsText(f);
  ev.target.value="";
}
function csvExport(){
  var b=monatsBilanz(ansicht.jahr,ansicht.monat), sep=";";
  function q(s){ return '"'+String(s===null||s===undefined?"":s).replace(/"/g,'""')+'"'; }
  var zeilen=[["Datum","Tag","Art","Kommen","Gehen","Pausen","Pause h","Dienstgaenge","Dienstgang h","Brutto","Abzug","gekappt","Ist","Soll","Saldo","Korrekturen","Notiz"].map(q).join(sep)];
  b.tage.forEach(function(r){
    var t=state.tage[r.key]||{};
    zeilen.push([
      q(fmtDatum(r.key)), q(WT_KURZ[r.dow]), q(r.feiertag||r.artName),
      q(r.kommen!==null?fmtUhr(r.kommen):""), q(r.gehen!==null?fmtUhr(r.gehen):""),
      q(r.pausen.map(function(x){return fmtUhr(x.a)+"-"+fmtUhr(x.b);}).join(" / ")), q(fmtDauer(r.gebuchtePause)),
      q(r.dienstgaenge.map(function(x){return fmtUhr(x.a)+"-"+fmtUhr(x.b);}).join(" / ")), q(fmtDauer(r.dienstgangSumme)),
      q(fmtDauer(r.brutto)), q(fmtDauer(r.abzug)), q(fmtDauer(r.gekappt)),
      q(fmtDauer(r.ist)), q(fmtDauer(r.soll)), q(fmtSaldo(r.saldo)),
      q((r.korrekturen||[]).map(function(k){return k.min+" min: "+(k.grund||"ohne Begründung");}).join(" / ")),
      q(t.notiz||"")
    ].join(sep));
  });
  zeilen.push("");
  zeilen.push([q("Summe Monat"),q(""),q(""),q(""),q(""),q(""),q(fmtDauer(b.pause)),q(""),q(fmtDauer(b.dienstgang)),
    q(""),q(""),q(""),q(fmtDauer(b.ist)),q(fmtDauer(b.soll)),q(fmtSaldo(b.saldo)),q(""),q("")].join(sep));
  zeilen.push([q("Kontostand am Monatsende"),q(fmtSaldo(kontostandBis(letzterTagKey())))].join(sep));
  download("zeiterfassung-"+ansicht.jahr+"-"+pad2(ansicht.monat+1)+".csv","﻿"+zeilen.join("\r\n"),"text/csv;charset=utf-8");
}

function themeAnwenden(){
  var t=E().theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  var dunkel = t==="dunkel" || (t==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", dunkel?"#1a1e22":"#1f4e79");
}
document.getElementById("themeBtn").addEventListener("click",function(){
  var e=E();
  var dunkelJetzt = e.theme==="dunkel" || (e.theme==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  e.theme = dunkelJetzt?"hell":"dunkel";
  speichern(); themeAnwenden();
  if(ansicht.seite==="einstellungen") zeichneEinstellungen();
});

function iconDataUrl(px){
  try{
    var c=document.createElement("canvas"); c.width=px; c.height=px;
    var x=c.getContext("2d"); if(!x) return null;
    var r=px*0.22;
    x.fillStyle="#1f4e79";
    x.beginPath();
    if(x.roundRect) x.roundRect(0,0,px,px,r);
    else { x.moveTo(r,0); x.arcTo(px,0,px,px,r); x.arcTo(px,px,0,px,r); x.arcTo(0,px,0,0,r); x.arcTo(0,0,px,0,r); }
    x.closePath(); x.fill();
    x.strokeStyle="#ffffff"; x.lineCap="round"; x.lineJoin="round"; x.lineWidth=px*0.055;
    x.beginPath(); x.arc(px/2,px/2,px*0.29,0,Math.PI*2); x.stroke();
    x.beginPath(); x.moveTo(px/2,px*0.30); x.lineTo(px/2,px*0.52); x.lineTo(px*0.665,px*0.60); x.stroke();
    return c.toDataURL("image/png");
  }catch(err){ return null; }
}
function pwaEinrichten(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#1f4e79"/><circle cx="256" cy="256" r="148" fill="none" stroke="#fff" stroke-width="28"/><path d="M256 154v112l84 42" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var svgUrl="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  var icons=[{src:svgUrl,sizes:"any",type:"image/svg+xml",purpose:"any"}];
  var png512=iconDataUrl(512);
  if(png512) icons.push({src:png512,sizes:"512x512",type:"image/png",purpose:"any maskable"});
  var manifest={
    name:"Zeiterfassung", short_name:"Zeiten",
    description:"Private Parallelaufzeichnung der Arbeitszeit",
    start_url:".", scope:".", display:"standalone", orientation:"any",
    background_color:"#f4f6f8", theme_color:"#1f4e79", lang:"de", icons:icons
  };
  try{
    var blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    var l=document.createElement("link"); l.rel="manifest"; l.href=URL.createObjectURL(blob);
    document.head.appendChild(l);
  }catch(err){}
  var ap=document.createElement("link"); ap.rel="apple-touch-icon"; ap.href=iconDataUrl(180)||svgUrl;
  document.head.appendChild(ap);
  var fav=document.createElement("link"); fav.rel="icon"; fav.type="image/svg+xml"; fav.href=svgUrl;
  document.head.appendChild(fav);
}
