<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeiterfassung</title>
<meta name="theme-color" content="#070b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<meta name="color-scheme" content="light dark">
<style>
/* =========================================================================
   Design „Aurora" — komplette Optik-Schicht.
   Der Rechenkern und die Druckausgabe bleiben unverändert.
   ========================================================================= */

/* ---- Farbwelt (hell) ---- */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface2:#f2f5fa; --text:#141c2b; --muted:#5d6b81;
  --line:#dfe5ef; --line-stark:#c2cddd;
  --akzent:#4f6ef7; --akzent-weich:#e8edff;
  --grad-a:#4f6ef7; --grad-b:#18b6d4;
  /* Verlauf fuer Flaechen MIT weissem Text — beide Enden >= 4,5:1 (WCAG AA) */
  --gtxt-a:#4f46e5; --gtxt-b:#0e7490;
  --marker-plus:#0b6b4a; --marker-akzent:#3451c9;
  --plus:#0d9668; --minus:#e11d48; --warn:#b45309; --warn-bg:#fdf3d8;
  --bar-plus:#0d9668; --bar-minus:#e11d48; --fokus:#4f6ef7;
  --akzent-voll:#4f6ef7; --plus-voll:#0d9668; --minus-voll:#e11d48; --warn-voll:#d97706;
  --schatten:0 8px 24px rgba(20,30,55,.07),0 2px 6px rgba(20,30,55,.05);
  --kopf-bg:#16203a; --kopf-text:#ffffff;
  --tint-plus:#e2f7ee; --tint-minus:#fde7ec; --tint-akzent:#e8f1ff;
  --rand-plus:#0d9668; --rand-minus:#e11d48; --rand-warn:#d97706; --rand-akzent:#4f6ef7;
  --puls:rgba(13,150,104,.4);
  --z-gruen:#d3f3e0; --z-rot:#fcdfdd; --z-gelb:#faf0d0; --z-blau:#e9edf4; --woche-bg:#e5ebf6;
  --glas:rgba(255,255,255,.72);
  --aur-op:.32;
}
/* ---- Farbwelt (dunkel) ---- */
:root[data-theme="dunkel"]{
  --bg:#070b13; --surface:#0f1624; --surface2:#161f30; --text:#e8edf6; --muted:#8593a9;
  --line:#1d2739; --line-stark:#2d3b54;
  --akzent:#7c9aff; --akzent-weich:#182449;
  --grad-a:#6d8bff; --grad-b:#22d3ee;
  --marker-plus:#34d399; --marker-akzent:#7c9aff;
  --plus:#34d399; --minus:#fb7185; --warn:#fbbf24; --warn-bg:#2b2210;
  --bar-plus:#34d399; --bar-minus:#fb7185; --fokus:#7c9aff;
  --akzent-voll:#5b7bff; --plus-voll:#10b981; --minus-voll:#e11d48; --warn-voll:#d97706;
  --schatten:0 10px 30px rgba(0,0,0,.45);
  --kopf-bg:#0a101c; --kopf-text:#e8edf6;
  --tint-plus:#0c2b20; --tint-minus:#32151d; --tint-akzent:#12203c;
  --rand-plus:#10b981; --rand-minus:#e11d48; --rand-warn:#d97706; --rand-akzent:#5b7bff;
  --puls:rgba(52,211,153,.5);
  --z-gruen:#0e3323; --z-rot:#3c1a20; --z-gelb:#312811; --z-blau:#101828; --woche-bg:#141f33;
  --glas:rgba(9,14,25,.72);
  --aur-op:.2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="hell"]){
    --bg:#070b13; --surface:#0f1624; --surface2:#161f30; --text:#e8edf6; --muted:#8593a9;
    --line:#1d2739; --line-stark:#2d3b54;
    --akzent:#7c9aff; --akzent-weich:#182449;
    --grad-a:#6d8bff; --grad-b:#22d3ee;
    --marker-plus:#34d399; --marker-akzent:#7c9aff;
    --plus:#34d399; --minus:#fb7185; --warn:#fbbf24; --warn-bg:#2b2210;
    --bar-plus:#34d399; --bar-minus:#fb7185; --fokus:#7c9aff;
    --akzent-voll:#5b7bff; --plus-voll:#10b981; --minus-voll:#e11d48; --warn-voll:#d97706;
    --schatten:0 10px 30px rgba(0,0,0,.45);
    --kopf-bg:#0a101c; --kopf-text:#e8edf6;
    --tint-plus:#0c2b20; --tint-minus:#32151d; --tint-akzent:#12203c;
    --rand-plus:#10b981; --rand-minus:#e11d48; --rand-warn:#d97706; --rand-akzent:#5b7bff;
    --puls:rgba(52,211,153,.5);
    --z-gruen:#0e3323; --z-rot:#3c1a20; --z-gelb:#312811; --z-blau:#101828; --woche-bg:#141f33;
    --glas:rgba(9,14,25,.72);
    --aur-op:.2;
  }
}

/* ---- Grundgerüst ---- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px}
::selection{background:var(--akzent-weich)}

/* ---- Aurora-Hintergrund: drei weiche Farbfelder, die langsam treiben ---- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:72vmax;height:72vmax;border-radius:50%;opacity:var(--aur-op)}
.aurora .a1{background:radial-gradient(circle,var(--grad-a) 0%,transparent 62%);top:-32vmax;left:-22vmax;animation:drift1 26s ease-in-out infinite alternate}
.aurora .a2{background:radial-gradient(circle,var(--grad-b) 0%,transparent 62%);bottom:-34vmax;right:-26vmax;animation:drift2 34s ease-in-out infinite alternate}
.aurora .a3{background:radial-gradient(circle,#a855f7 0%,transparent 62%);top:30%;right:-40vmax;width:56vmax;height:56vmax;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(1.18)}}
@keyframes drift3{to{transform:translate(-10vmax,8vmax)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}

/* ---- Scroll-Reveal: Abschnitte fliegen beim Scrollen weich ins Bild ---- */
.reveal{opacity:0;transform:translateY(26px) scale(.985);
  transition:opacity .65s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .65s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ---- Buehne: die Stempeluhr fuellt den Schirm, darunter rollen die Karten herein ---- */
.hero{min-height:calc(100vh - 170px);min-height:calc(100svh - 170px);
  display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;padding-bottom:46px}
@media(max-width:719px){.hero{min-height:calc(100vh - 240px);min-height:calc(100svh - 240px)}}
.rollin{opacity:.001;transform-origin:50% 100%;will-change:transform,opacity}
.eng > .rollin{margin-top:16vh}
.eng > .rollin:last-child{margin-bottom:12vh}
@media (prefers-reduced-motion:reduce){.rollin{opacity:1!important;transform:none!important}}
.scrollhint{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;
  color:var(--muted);box-shadow:var(--schatten);transition:opacity .45s ease;pointer-events:none}
.scrollhint svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  .scrollhint{animation:huepf 2.3s ease-in-out infinite}
  @keyframes huepf{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
}

/* ---- Topbar (Glas) ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--glas);
  -webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0 0}
.topbar-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:56px}
.marke{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-weight:750;letter-spacing:-.01em;font-size:15.5px;min-width:0}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 3px 10px rgba(79,110,247,.4)}
.logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:999px}
.nav a{display:inline-flex;align-items:center;min-height:34px;padding:0 15px;border-radius:999px;text-decoration:none;
  color:var(--muted);font-size:13.5px;font-weight:650;transition:color .2s,background .2s}
.nav a:hover{color:var(--text)}
.nav a.aktiv{background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));color:#fff;box-shadow:0 2px 10px rgba(79,110,247,.4)}
.iconbtn{min-width:38px;min-height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 9px;color:var(--muted);transition:color .2s,border-color .2s,transform .3s}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--akzent);border-color:var(--akzent)}
.iconbtn:active{transform:rotate(-30deg)}
.iconbtn.aktiv{background:var(--akzent-weich);color:var(--akzent);border-color:var(--akzent)}

/* ---- Bottom-Navigation (nur schmale Schirme) ---- */
.bottomnav{display:none}
@media(max-width:719px){
  .nav{display:none}
  .bottomnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:35;
    display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;
    background:var(--glas);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);
    border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 36px rgba(0,0,0,.28)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:18px;
    text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.01em;transition:color .2s,background .2s}
  .bottomnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bottomnav a.aktiv{color:#fff;background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));box-shadow:0 4px 14px rgba(79,110,247,.45)}
  main{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
}

main{max-width:1400px;margin:0 auto;padding:20px 16px 72px}
.eng{max-width:720px;margin:0 auto}
.eng > * + *{margin-top:16px}

h1{font-size:clamp(24px,6vw,30px);margin:0;font-weight:800;letter-spacing:-.02em}
.gruss h1{background:linear-gradient(115deg,var(--text) 40%,var(--akzent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gruss{margin-bottom:2px}
h2{font-size:13px;margin:24px 0 10px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--akzent)}
h3{font-size:15px;margin:20px 0 8px;font-weight:700}
p.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 4px;font-size:12.5px}

.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--schatten)}
.pad{padding:18px}

#banner{display:none;margin:0;padding:10px 16px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
#banner.an{display:block}

/* ---- Statuskarte: Uhr als Hauptmotiv + Fortschrittsring ---- */
.status{padding:22px;border:1px solid var(--line);position:relative;overflow:hidden;border-radius:20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  transition:background .6s ease,border-color .6s ease}
.s-links{flex:1 1 220px;min-width:0}
.status .zeile1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status .zustand{font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.09em}
.status .marker{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;
  border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.status .uhr{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(48px,13vw,76px);font-weight:750;letter-spacing:-.03em;line-height:1.05;margin-top:10px;
  font-variant-numeric:tabular-nums}
.status .seit{color:var(--muted);font-size:13px;margin-top:6px}
.status[data-z="arbeit"]{background:var(--tint-plus);border-color:var(--rand-plus)}
.status[data-z="pause"]{background:var(--warn-bg);border-color:var(--rand-warn)}
.status[data-z="dienstgang"]{background:var(--tint-akzent);border-color:var(--rand-akzent)}
.status[data-z="arbeit"] .marker{background:var(--tint-plus);border-color:var(--rand-plus);color:var(--marker-plus)}
.status[data-z="pause"] .marker{background:var(--warn-bg);border-color:var(--rand-warn);color:var(--warn)}
.status[data-z="dienstgang"] .marker{background:var(--tint-akzent);border-color:var(--rand-akzent);color:var(--marker-akzent)}
.status[data-z="arbeit"] .uhr{text-shadow:0 0 26px var(--puls)}
@media (prefers-reduced-motion:no-preference){
  .status[data-z="arbeit"]{animation:atmen 4.5s ease-in-out infinite}
  @keyframes atmen{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}50%{box-shadow:0 0 34px -6px var(--puls)}}
}
.status .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:none;background:var(--plus);animation:puls 2s infinite}
.status[data-z="arbeit"] .dot,.status[data-z="dienstgang"] .dot{display:inline-block}
.status[data-z="dienstgang"] .dot{background:var(--akzent)}
@keyframes puls{0%{box-shadow:0 0 0 0 var(--puls)}70%{box-shadow:0 0 0 9px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@media (prefers-reduced-motion:reduce){
  .status .dot{animation:none}
  .taste.blitz{animation:none}
  table.monat tr.blink td:nth-child(n+3){animation:none}
}

/* Fortschrittsring: Tages-Ist im Verhältnis zum Soll */
.s-ring{position:relative;width:132px;height:132px;flex:0 0 auto;margin-left:auto}
.s-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;
  stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .9s cubic-bezier(.22,.8,.25,1)}
.ring-fill.voll{stroke:var(--plus)}
#ringGrad stop:first-child{stop-color:var(--grad-a)}
#ringGrad stop:last-child{stop-color:var(--grad-b)}
.ring-mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring-pct{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring-sub{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;text-align:center;max-width:80px}
@media(max-width:560px){.s-ring{width:106px;height:106px}.ring-pct{font-size:21px}}

/* ---- Buchungstasten: kräftige Farbflächen = eindeutig anklickbar ---- */
.tasten{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.taste{position:relative;min-height:92px;border-radius:18px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#fff;box-shadow:var(--schatten);overflow:hidden;
  transition:transform .16s ease,box-shadow .2s ease,opacity .2s ease}
.taste svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;margin-bottom:3px}
.taste .tl{font-weight:750;font-size:16.5px;letter-spacing:.02em}

.taste:not([disabled]):hover{transform:translateY(-2px)}
.taste:not([disabled]):active{transform:scale(.96)}
.taste.kommen:not([disabled]){background:linear-gradient(140deg,#047857,#04835f);border-color:transparent;box-shadow:0 8px 22px rgba(16,185,129,.35)}
.taste.gehen:not([disabled]){background:linear-gradient(140deg,#be123c,#d31745);border-color:transparent;box-shadow:0 8px 22px rgba(225,29,72,.32)}
.taste.pause:not([disabled]){background:linear-gradient(140deg,#92400e,#b45309);border-color:transparent;box-shadow:0 8px 22px rgba(217,119,6,.32)}
.taste.dienstgang:not([disabled]){background:linear-gradient(140deg,var(--gtxt-a),var(--gtxt-b));border-color:transparent;box-shadow:0 8px 22px rgba(79,110,247,.35)}
.taste[disabled]{background:var(--surface2);color:var(--muted);border:1.5px dashed var(--line-stark);cursor:not-allowed;box-shadow:none}
.taste.blitz{animation:blitz .5s ease}
@keyframes blitz{0%{box-shadow:inset 0 0 0 120px rgba(255,255,255,.45)}100%{box-shadow:inset 0 0 0 120px rgba(255,255,255,0)}}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--glas);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line-stark);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  padding:11px 14px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 28px);font-size:14px;font-weight:550;
  transition:opacity .3s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
#toast.an{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(max-width:719px){#toast{bottom:calc(96px + env(safe-area-inset-bottom))}}
#toast button{border:1px solid var(--line-stark);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;color:var(--akzent)}

/* ---- Stundenkonto ---- */
.konto{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.konto .gross{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.konto .gross.p{color:var(--plus)} .konto .gross.m{color:var(--minus)}
.konto .neben{color:var(--muted);font-size:14px;padding-bottom:7px}
.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--akzent);margin-bottom:8px}

/* Mini-Verlauf: Tagessalden der letzten 14 Tage */
.spark{display:flex;gap:4px;align-items:stretch;height:64px;margin-top:14px;position:relative;padding:0 2px}
.spark::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-stark)}
.sp-t{flex:1;position:relative;border-radius:5px;min-width:0}
.sp-t:hover{background:var(--surface2)}
.sp-t i{position:absolute;left:22%;right:22%;border-radius:3px;min-height:3px}
.sp-t i.oben{bottom:50%}
.sp-t i.unten{top:50%}
.sp-t i.p{background:var(--plus)} .sp-t i.m{background:var(--minus)} .sp-t i.w{background:var(--line-stark)}
.spark-label{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---- „Heute"-Kacheln ---- */
.heute{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.heute > div{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.heute .k{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:750}
.heute .v{font-size:20px;font-weight:750;margin-top:4px}

/* ---- Hinweise ---- */
.hinweise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.hinweise li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.hinweise li .sym{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:0 0 auto;color:var(--muted)}
.hinweise li.w{background:var(--warn-bg);border-color:var(--rand-warn)}
.hinweise li.w .sym{background:var(--warn-voll);border-color:transparent;color:#fff}
.hinweise li button{margin-left:auto;align-self:center;background:none;border:none;color:var(--akzent);cursor:pointer;font-size:13px;font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}

/* ---- CTA-Karte zur Monatsübersicht ---- */
.cta{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));box-shadow:0 10px 28px rgba(79,110,247,.35);
  transition:transform .18s ease,box-shadow .18s ease;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:-60%;left:-20%;width:60%;height:220%;transform:rotate(24deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(79,110,247,.45)}
.cta-ico{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cta-ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cta-txt{min-width:0}
.cta-txt strong{display:block;font-size:16px;font-weight:750}
.cta-txt span{font-size:12.5px;opacity:.88}
.cta-pfeil{margin-left:auto;font-size:22px;font-weight:700;transition:transform .18s ease}
.cta:hover .cta-pfeil{transform:translateX(4px)}

/* ---- Aufklapp-Karten (details/summary) ---- */
details.acc{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-weight:700;user-select:none;-webkit-user-select:none;font-size:14.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface2)}
.chev{margin-left:auto;width:22px;height:22px;flex:0 0 auto;position:relative;transition:transform .3s ease}
.chev::before{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg)}
details[open] > summary .chev{transform:rotate(180deg)}
.acc-body{padding:2px 16px 18px}
@media (prefers-reduced-motion:no-preference){
  details[open] .acc-body{animation:accAuf .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes accAuf{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
}
.acc-ico{width:32px;height:32px;border-radius:10px;background:var(--akzent-weich);color:var(--akzent);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800;font-size:13px}
.acc-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acc-warn > summary .acc-ico{background:var(--warn-bg);color:var(--warn)}
.acc-titel{display:flex;flex-direction:column;min-width:0}
.acc-titel small{font-weight:550;color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zaehler{background:var(--akzent-weich);color:var(--akzent);border-radius:999px;font-size:12px;font-weight:800;padding:2px 9px;margin-left:6px}
.acc-warn .zaehler{background:var(--warn-bg);color:var(--warn)}
.acc.klein{background:var(--surface2);border-radius:12px}
.acc.klein summary{padding:10px 13px;font-size:13px;color:var(--muted);font-weight:650}
.acc.klein .acc-body{padding:0 13px 12px}
.sektliste details.acc + details.acc{margin-top:12px}
.acc-body .hinweise{margin-top:4px}

/* ---- Monats-Werkzeugleiste ---- */
.monatsleiste{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mnav{display:flex;align-items:center;gap:6px}
.monatsleiste .titel{font-size:21px;font-weight:800;letter-spacing:-.01em;min-width:170px;text-align:center}
.fluss{flex:1}
.btn{border:1px solid var(--line-stark);background:var(--surface);border-radius:12px;min-height:40px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:650;transition:border-color .15s,color .15s,background .15s,transform .12s}
.btn:hover{border-color:var(--akzent);color:var(--akzent)}
.btn:active{transform:scale(.97)}
.btn.rund{min-width:40px;padding:0;border-radius:999px;font-size:19px;line-height:1}
.btn.prim{background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(79,110,247,.35)}
.btn.prim:hover{color:#fff;filter:brightness(1.07)}
.btn.gefahr{color:var(--minus);border-color:var(--minus)}
.btn.gefahr:hover{background:var(--tint-minus);color:var(--minus)}
.monatsleiste select,.monatsleiste input{min-height:40px;border-radius:12px}

/* ---- Reiter Monat/Jahr mit Gleiter ---- */
.infokopf{display:flex;margin-bottom:16px}
.reiter{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;min-width:220px}
.reiter .glider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
  background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));box-shadow:0 2px 10px rgba(79,110,247,.4);
  transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.reiter[data-pos="1"] .glider{transform:translateX(100%)}
.reiter button{position:relative;z-index:1;background:none;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14.5px;transition:color .25s}
.reiter button:hover{color:var(--text)}
.reiter button.aktiv{color:#fff}

/* ---- Kennzahl-Kacheln (Bildschirm: Karten, Druck: 9er-Raster) ---- */
.kacheln{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.kacheln > div{flex:1 1 150px;min-width:128px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--schatten)}
.kacheln > div:nth-child(-n+4){flex-basis:168px}
.kacheln > div:nth-child(-n+4) .v{font-size:25px}
.kacheln .k{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:750}
.kacheln .v{font-size:19px;font-weight:750;margin-top:4px}
.kacheln > div.kp{background:var(--tint-plus);border-color:var(--rand-plus)}
.kacheln > div.km{background:var(--tint-minus);border-color:var(--rand-minus)}
.p{color:var(--plus)} .m{color:var(--minus)}

/* ---- Monatstabelle ----
   Höhe so begrenzt, dass der Kasten samt fixierter Kopfzeile ganz auf den Schirm passt;
   gescrollt wird dann innerhalb der Tabelle, die Kopfzeile bleibt dabei stehen. */
.tabwrap{overflow:auto;max-height:calc(100vh - 124px);border:1px solid var(--line);border-radius:16px;background:var(--surface);-webkit-overflow-scrolling:touch;box-shadow:var(--schatten)}
.tabwrap::-webkit-scrollbar{height:10px;width:10px}
.tabwrap::-webkit-scrollbar-thumb{background:var(--line-stark);border-radius:5px}
.tabwrap::-webkit-scrollbar-corner{background:transparent}
table.monat{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;table-layout:fixed;min-width:1178px}
/* Feste Spaltenbreiten: sonst schiebt die automatische Verteilung den gesamten
   Ueberschuss in die Datumsspalte, die als fixierte Spalte dauerhaft Platz kostet. */
table.monat th:nth-child(1),table.monat td:nth-child(1){width:86px}
table.monat th:nth-child(2),table.monat td:nth-child(2){width:32px}
table.monat th:nth-child(3),table.monat td:nth-child(3){width:128px}
table.monat th:nth-child(4),table.monat td:nth-child(4),
table.monat th:nth-child(5),table.monat td:nth-child(5){width:66px}
table.monat th:nth-child(6),table.monat td:nth-child(6),
table.monat th:nth-child(8),table.monat td:nth-child(8){width:140px}
table.monat th:nth-child(7),table.monat td:nth-child(7){width:56px}
table.monat th:nth-child(9),table.monat td:nth-child(9){width:46px}
table.monat th:nth-child(10),table.monat td:nth-child(10){width:62px}
table.monat th:nth-child(11),table.monat td:nth-child(11){width:58px}
table.monat th:nth-child(12),table.monat td:nth-child(12){width:52px}
table.monat th:nth-child(13),table.monat td:nth-child(13){width:48px}
table.monat th:nth-child(14),table.monat td:nth-child(14){width:78px}
/* Notiz-Spalte bewusst ohne Breite: sie nimmt den Ueberschuss auf, damit die
   fixierten Spalten 1 und 2 exakt bei 86 px bzw. 32 px bleiben (sonst stimmt left nicht). */
table.monat th{position:sticky;top:0;z-index:4;background:var(--kopf-bg);text-align:left;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.72);padding:10px 5px;border-bottom:1px solid var(--line-stark);white-space:nowrap}
table.monat td{padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;height:42px}
table.monat tr:last-child td{border-bottom:none}
/* Zeilen-Hover als Überlagerung — funktioniert auch auf den getönten Zeilen */
table.monat tbody tr:not(.wochenzeile):hover td{background-image:linear-gradient(rgba(124,154,255,.09),rgba(124,154,255,.09))}
/* Fixiert: Datum (Spalte 1) und Wochentag (Spalte 2) bleiben beim Querscrollen links stehen.
   left muss exakt der Breite von Spalte 1 entsprechen (86 px, siehe oben). */
table.monat th:nth-child(1),table.monat td:nth-child(1){position:sticky;left:0;z-index:3;background:var(--surface)}
table.monat th:nth-child(2),table.monat td:nth-child(2){position:sticky;left:86px;z-index:3;background:var(--surface);box-shadow:1px 0 0 var(--line-stark)}
/* Ecke: die fixierte Kopfzeile muss ueber den fixierten Spalten liegen */
table.monat th:nth-child(1),table.monat th:nth-child(2){z-index:5;background:var(--kopf-bg)}
/* Zeilenfarben — treffen alle Zellen der Zeile, also auch die fixierten Spalten */
table.monat tr.z-blau td{background:var(--z-blau)}
table.monat tr.z-gelb td{background:var(--z-gelb)}
table.monat tr.z-gruen td{background:var(--z-gruen)}
table.monat tr.z-rot td{background:var(--z-rot)}
/* Kantenmarke links als zweites Signal neben der Fläche */
table.monat tr.z-gruen td:nth-child(1){box-shadow:inset 3px 0 0 var(--plus)}
table.monat tr.z-rot td:nth-child(1){box-shadow:inset 3px 0 0 var(--minus)}
table.monat tr.z-gelb td:nth-child(1){box-shadow:inset 3px 0 0 var(--warn)}
table.monat tr.z-blau td:nth-child(1){box-shadow:inset 3px 0 0 var(--line-stark)}
/* Auf den kraeftigen Flaechen traegt die Zeilenfarbe die Aussage — die Zahl bleibt
   in der Grundfarbe, sonst reicht der Kontrast im Dunkelmodus nicht. */
table.monat tr.z-gruen td .p,table.monat tr.z-gruen td .m,
table.monat tr.z-rot td .p,table.monat tr.z-rot td .m{color:var(--text)}
table.monat tr.z-gruen .bar,table.monat tr.z-rot .bar{background:rgba(0,0,0,.12)}
table.monat tr.frei td{color:var(--muted)}
/* Klassenname bewusst nicht "heute": den belegt bereits das Kachelraster der Stempeluhr. */
table.monat tr.tag-heute td:nth-child(1){box-shadow:inset 3px 0 0 var(--akzent)}
/* Wochensumme: deutlich abgesetztes Band nach jeder Kalenderwoche */
table.monat tr.wochenzeile td{
  background:var(--woche-bg);color:var(--text);font-weight:700;height:36px;
  border-top:2px solid var(--akzent);border-bottom:2px solid var(--akzent);
}
table.monat tr.wochenzeile td:nth-child(1){letter-spacing:.04em}
table.monat tr.wochenzeile td:nth-child(3){
  font-weight:650;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--akzent);
}
/* Zeilen erscheinen beim Monatswechsel gestaffelt (nur Deckkraft — schont die fixierten Spalten) */
@media (prefers-reduced-motion:no-preference){
  table.monat.rows-in tbody tr{animation:zeileAuf .45s ease both;animation-delay:calc(var(--i,0)*14ms)}
  @keyframes zeileAuf{from{opacity:0}to{opacity:1}}
}
table.monat tr.blink td:nth-child(n+3){animation:blink 1.6s ease}
@keyframes blink{0%,40%{background:var(--akzent-weich)}100%{background:transparent}}
table.monat td.r{text-align:right}
.calc{color:var(--muted)}
.calc.stark{color:var(--text);font-weight:600}
/* Eingabefelder in der Tabelle: gestrichelte Linie = hier darf getippt werden */
table.monat input.t{width:56px;min-height:34px;padding:3px 3px;border:1px solid transparent;border-bottom:1px dashed var(--line-stark);border-radius:8px;background:transparent;text-align:center;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
table.monat input.t:hover{border-color:var(--akzent);background:var(--surface)}
table.monat input.t:focus{border:1px solid var(--fokus);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--akzent-weich)}
table.monat input.t::placeholder{color:var(--line-stark)}
.artbtn{background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12.5px;font-weight:600;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;text-decoration:underline dotted var(--muted);text-underline-offset:3px;transition:background .15s,color .15s,border-color .15s}
.artbtn:hover{border-color:var(--akzent);background:var(--akzent-weich);color:var(--akzent);text-decoration:none}
.notizbtn{background:none;border:1px dashed transparent;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--muted);font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-align:left;transition:background .15s,color .15s,border-color .15s}
.notizbtn:hover{border-color:var(--akzent);background:var(--akzent-weich);color:var(--akzent)}
.notizbtn .n-leer{opacity:.55}
.mark{font-size:10px;font-weight:750;color:var(--warn);margin-left:3px;vertical-align:super;cursor:help}
.stift{color:var(--muted);font-size:11px;margin-left:3px}
.bar{display:block;position:relative;width:62px;height:9px;margin-top:3px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-stark)}
.bfill{position:absolute;top:0;bottom:0;border-radius:5px}
.bfill.p{background:var(--bar-plus)} .bfill.m{background:var(--bar-minus)}

/* ---- Tagesdetail: gleitet von rechts (Desktop) bzw. von unten (Telefon) herein ---- */
#backdrop{position:fixed;inset:0;background:rgba(4,8,16,.5);z-index:40;opacity:0;pointer-events:none;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .32s ease}
#backdrop.an{opacity:1;pointer-events:auto}
#detail{position:fixed;z-index:50;right:0;top:0;bottom:0;width:min(600px,100%);background:var(--surface);
  border-left:1px solid var(--line);overflow-y:auto;box-shadow:-12px 0 34px rgba(0,0,0,.2);
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(103%);visibility:hidden;
  transition:transform .38s cubic-bezier(.32,.72,.22,1),visibility 0s linear .38s}
#detail.an{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.32,.72,.22,1)}
.griff{display:none}
@media(max-width:640px){
  #detail{top:auto;height:92vh;width:100%;border-left:none;border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;transform:translateY(103%)}
  .griff{display:block;width:44px;height:5px;border-radius:3px;background:var(--line-stark);margin:10px auto 2px}
}
.dkopf{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.dkopf .dt{font-weight:750;font-size:17px}
.dkopf .ds{color:var(--muted);font-size:13px}
.dbody{padding:14px 16px}
.ivliste{display:flex;flex-direction:column;gap:7px;margin:6px 0 0}
.ivzeile{display:flex;align-items:center;gap:8px}
.ivzeile input.t{width:84px;min-height:44px;text-align:center;border:1px solid var(--line-stark);border-radius:11px;background:var(--surface2);padding:4px 6px}
.ivzeile input.g{flex:1;min-height:44px;border:1px solid var(--line-stark);border-radius:11px;background:var(--surface2);padding:4px 10px;min-width:60px}
.ivzeile input.z{width:92px;min-height:44px;text-align:right;border:1px solid var(--line-stark);border-radius:11px;background:var(--surface2);padding:4px 8px}
.ivzeile .bis{color:var(--muted);font-size:14px}
.del{border:1px solid var(--line);background:var(--surface);border-radius:11px;min-width:44px;min-height:44px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;transition:color .15s,border-color .15s}
.del:hover{color:var(--minus);border-color:var(--minus)}
.addbtn{margin-top:8px;border:1.5px dashed var(--line-stark);background:none;border-radius:12px;min-height:44px;padding:0 12px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:650;width:100%;transition:color .15s,border-color .15s,background .15s}
.addbtn:hover{color:var(--akzent);border-color:var(--akzent);background:var(--akzent-weich)}
.rechnung{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.rechnung td{padding:7px 2px;border-bottom:1px solid var(--line)}
.rechnung td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rechnung tr.sum td{font-weight:750;border-bottom:none;border-top:1px solid var(--line-stark);padding-top:8px}
.rechnung tr.zwi td{color:var(--muted)}

/* ---- Formulare ---- */
.feld{margin-bottom:14px}
.feld > label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.feld .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line-stark);border-radius:12px;background:var(--surface2);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--fokus);outline:none;box-shadow:0 0 0 3px var(--akzent-weich)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input.kurz{max-width:150px}
.reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-stark);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600;background:var(--surface2);user-select:none;-webkit-user-select:none;min-height:44px;transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
.chip input{position:absolute;opacity:0;pointer-events:none;margin:0;width:1px;height:1px;min-height:0}
.chip:hover{border-color:var(--akzent)}
.chip.an{background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 3px 12px rgba(79,110,247,.35)}
/* Schalter im iOS-Stil */
.schalter{display:flex;align-items:center;gap:11px;cursor:pointer;min-height:44px;font-size:14px;font-weight:650}
.schalter input{appearance:none;-webkit-appearance:none;width:47px;height:28px;min-height:0;border-radius:999px;background:var(--line-stark);position:relative;transition:background .25s;margin:0;flex:0 0 auto;cursor:pointer;border:none}
.schalter input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.schalter input:checked{background:linear-gradient(135deg,var(--gtxt-a),var(--gtxt-b))}
.schalter input:checked::after{transform:translateX(19px)}
.kernblock{border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px;background:var(--surface2)}
.kernblock .wt{font-weight:700;font-size:13.5px;margin-bottom:6px}
.trenner{height:1px;background:var(--line);margin:22px 0}
.knopfreihe{display:flex;gap:10px;flex-wrap:wrap}

/* ---- Jahresansicht ---- */
.jahrtab{width:100%;border-collapse:collapse;font-size:14px}
.jahrtab th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line-stark)}
.jahrtab th.r,.jahrtab td.r{text-align:right}
.jahrtab td{padding:10px 8px;border-bottom:1px solid var(--line)}
.jahrtab tbody tr:hover td{background:var(--surface2)}
.jahrtab tr.jetzt td{font-weight:700;background:var(--akzent-weich)}
.legende{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.7}
.farbchip{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid var(--line-stark);vertical-align:-2px;margin-right:5px}

#druckkopf{display:none}
.unterschrift{display:none}

@media(max-width:560px){

<script id="engine">
/* =========================================================================
   RECHENKERN — bewusst ohne DOM-Zugriff, damit er separat prüfbar ist.
   ========================================================================= */
"use strict";

var WT_KURZ = ["So","Mo","Di","Mi","Do","Fr","Sa"];
var WT_LANG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MONATE  = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function pad2(n){ return String(n).length<2 ? "0"+n : String(n); }

/* ---- Datum ---- */
function keyOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function dateOf(key){ var t=String(key).split("-"); return new Date(+t[0],+t[1]-1,+t[2]); }
function fmtDatum(key){ var t=String(key).split("-"); return t[2]+"."+t[1]+"."+t[0]; }
function fmtDatumKurz(key){ var t=String(key).split("-"); return t[2]+"."+t[1]+"."; }
function tageImMonat(j,m){ return new Date(j,m+1,0).getDate(); }
function isoWoche(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
function isoWocheKey(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  return t.getFullYear()+"-KW"+pad2(isoWoche(d));
}

/* ---- Zeit ---- */
function parseZeit(str){
  if(str===null||str===undefined) return null;
  var s=String(str).trim().toLowerCase().replace(/uhr/g,"").replace(/\s+/g,"").replace(/[.,;]/g,":");
  if(!s) return null;
  var h,m;
  if(s.indexOf(":")>=0){
    var p=s.split(":");
    if(p[0]==="") return null;
    h=parseInt(p[0],10); m=(p[1]===""||p[1]===undefined)?0:parseInt(p[1],10);
  } else if(/^\d{1,2}$/.test(s)){ h=parseInt(s,10); m=0; }
  else if(/^\d{3}$/.test(s)){ h=parseInt(s.slice(0,1),10); m=parseInt(s.slice(1),10); }
  else if(/^\d{4}$/.test(s)){ h=parseInt(s.slice(0,2),10); m=parseInt(s.slice(2),10); }
  else return null;
  if(!isFinite(h)||!isFinite(m)) return null;
  if(h===24&&m===0) return 1440;
  if(h<0||h>23||m<0||m>59) return null;
  return h*60+m;
}
function fmtUhr(min){
  if(min===null||min===undefined||!isFinite(min)) return "";
  var v=Math.round(min); if(v<0) v=0;
  return pad2(Math.floor(v/60))+":"+pad2(v%60);
}
function fmtDauer(min){
  var a=Math.abs(Math.round(min||0));
  return Math.floor(a/60)+":"+pad2(a%60);
}
function fmtSaldo(min){
  var v=Math.round(min||0);
  return (v>0?"+":v<0?"−":"±")+fmtDauer(v);
}
function parseDauer(str){
  if(str===null||str===undefined) return null;
  var s=String(str).trim().toLowerCase().replace(/h/g,"").replace(/\s+/g,"").replace(/[.,]/g,":");
  if(!s) return null;
  var neg=false;
  if(s.charAt(0)==="-"||s.charAt(0)==="−"||s.charAt(0)==="+"){ neg=(s.charAt(0)!=="+"); s=s.slice(1); }
  var h,m;
  if(s.indexOf(":")>=0){ var p=s.split(":"); h=parseInt(p[0]||"0",10); m=parseInt(p[1]||"0",10); }
  else if(/^\d+$/.test(s)){ h=parseInt(s,10); m=0; }
  else return null;
  if(!isFinite(h)||!isFinite(m)||m<0||m>59||h<0) return null;
  var v=h*60+m;
  return neg?-v:v;
}

/* ---- Feiertage: Gauß'sche Osterformel ---- */
function ostersonntag(jahr){
  var a=jahr%19, b=Math.floor(jahr/100), c=jahr%100,
      d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4,
      l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      mon=Math.floor((h+l-7*m+114)/31), tag=((h+l-7*m+114)%31)+1;
  return new Date(jahr,mon-1,tag);
}
var LAENDER = {
  BW:"Baden-Württemberg", BY:"Bayern", BE:"Berlin", BB:"Brandenburg", HB:"Bremen",
  HH:"Hamburg", HE:"Hessen", MV:"Mecklenburg-Vorpommern", NI:"Niedersachsen",
  NW:"Nordrhein-Westfalen", RP:"Rheinland-Pfalz", SL:"Saarland", SN:"Sachsen",
  ST:"Sachsen-Anhalt", SH:"Schleswig-Holstein", TH:"Thüringen"
};
var _ftCache={};
function feiertage(jahr,land){
  var ck=jahr+"|"+land;
  if(_ftCache[ck]) return _ftCache[ck];
  var r={};
  function fix(m,t,name){ r[jahr+"-"+pad2(m)+"-"+pad2(t)]=name; }
  function rel(off,name){ var o=ostersonntag(jahr); var d=new Date(o.getFullYear(),o.getMonth(),o.getDate()+off); r[keyOf(d)]=name; }
  fix(1,1,"Neujahr");
  fix(5,1,"Tag der Arbeit");
  fix(10,3,"Tag der Deutschen Einheit");
  fix(12,25,"1. Weihnachtstag");
  fix(12,26,"2. Weihnachtstag");
  rel(-2,"Karfreitag"); rel(1,"Ostermontag"); rel(39,"Christi Himmelfahrt"); rel(50,"Pfingstmontag");
  if(["BW","BY","ST"].indexOf(land)>=0) fix(1,6,"Heilige Drei Könige");
  if(["BE","MV"].indexOf(land)>=0) fix(3,8,"Internationaler Frauentag");
  if(land==="BB"){ rel(0,"Ostersonntag"); rel(49,"Pfingstsonntag"); }
  if(["BW","BY","HE","NW","RP","SL"].indexOf(land)>=0) rel(60,"Fronleichnam");
  if(["BY","SL"].indexOf(land)>=0) fix(8,15,"Mariä Himmelfahrt");
  if(land==="TH") fix(9,20,"Weltkindertag");
  if(["BB","HB","HH","MV","NI","SH","SN","ST","TH"].indexOf(land)>=0) fix(10,31,"Reformationstag");
  if(["BW","BY","NW","RP","SL"].indexOf(land)>=0) fix(11,1,"Allerheiligen");
  if(land==="SN"){
    var d=new Date(jahr,10,23);
    while(d.getDay()!==3) d.setDate(d.getDate()-1);
    r[keyOf(d)]="Buß- und Bettag";
  }
  _ftCache[ck]=r;
  return r;
}
function feiertagName(key,land){
  var j=parseInt(String(key).slice(0,4),10);
  return feiertage(j,land)[key]||null;
}

/* ---- Tagesarten ---- */
var ARTEN = {
  arbeit:        {name:"Arbeitstag",      sollFaktor:1,   gutschrift:0,   additiv:true },
  urlaub:        {name:"Urlaub",          sollFaktor:1,   gutschrift:1,   additiv:true },
  urlaub_halb:   {name:"Urlaub ½ Tag",    sollFaktor:1,   gutschrift:0.5, additiv:true },
  krank:         {name:"Krank",           sollFaktor:1,   gutschrift:1,   additiv:true },
  feiertag:      {name:"Feiertag",        sollFaktor:0,   gutschrift:0,   additiv:true },
  sonderurlaub:  {name:"Sonderurlaub / Dienstbefreiung", sollFaktor:1, gutschrift:1, additiv:true },
  fortbildung:   {name:"Fortbildung / Lehrgang", sollFaktor:1, gutschrift:1, additiv:false },
  gleittag:      {name:"Gleittag (Zeitausgleich)", sollFaktor:1, gutschrift:0, additiv:true },
  gleittag_halb: {name:"Gleittag ½ Tag",  sollFaktor:1,   gutschrift:0.5, additiv:true },
  wochenende:    {name:"Wochenende / frei", sollFaktor:0, gutschrift:0,   additiv:true }
};
var ART_REIHE = ["arbeit","urlaub","urlaub_halb","krank","feiertag","sonderurlaub","fortbildung","gleittag","gleittag_halb","wochenende"];

/* ---- Standard-Einstellungen ---- */
function standardEinstellungen(){
  return {
    wochenarbeitszeit: 2400,
    arbeitstage: [false,true,true,true,true,true,false],   /* 0=So … 6=Sa */
    tagessollAuto: true,
    tagessoll: 480,
    rahmenVon: "06:00",
    rahmenBis: "19:00",
    rahmenPruefung: true,
    kernzeitPruefung: false,   /* aus: keine Meldungen zur Kernarbeitszeit */
    kernzeiten: {
      "0":[], "6":[],
      "1":[{von:"08:30",bis:"12:00"},{von:"14:00",bis:"16:00"}],
      "2":[{von:"08:30",bis:"12:00"},{von:"14:00",bis:"16:00"}],
      "3":[{von:"08:30",bis:"12:00"},{von:"14:00",bis:"16:00"}],
      "4":[{von:"08:30",bis:"12:00"},{von:"14:00",bis:"18:00"}],
      "5":[{von:"08:30",bis:"12:00"}]
    },
    pausenstufen: [{grenze:360,pause:30},{grenze:540,pause:45}],
    verspaetungszuschlag: true,
    kappungAn: false,   /* aus: Zeit ueber der Tagesgrenze wird voll gutgeschrieben */
    kappung: 600,
    maxWoche: 3600,
    ruhezeit: 660,
    kontoMinus: 720,
    kontoPlus: 6000,
    startKonto: 0,
    stichtag: "",
    land: "RP",
    name: "",
    theme: "dunkel"   /* Startwert fuer neue Nutzer; gespeicherte Einstellungen bleiben unberuehrt */
  };
}
function tagessollBerechnet(e){
  if(!e.tagessollAuto) return Math.round(e.tagessoll||0);
  var n=0; for(var i=0;i<7;i++) if(e.arbeitstage[i]) n++;
  if(!n) return 0;
  return Math.round(e.wochenarbeitszeit/n);
}

/* ---- Intervall-Helfer ---- */
function verschmelze(rng){
  var s=rng.slice().sort(function(a,b){return a[0]-b[0];}), out=[];
  for(var i=0;i<s.length;i++){
    if(out.length && s[i][0]<=out[out.length-1][1]) out[out.length-1][1]=Math.max(out[out.length-1][1],s[i][1]);
    else out.push([s[i][0],s[i][1]]);
  }
  return out;
}
function ueberlappung(a,b,rng){
  var sum=0;
  for(var i=0;i<rng.length;i++){
    var lo=Math.max(a,rng[i][0]), hi=Math.min(b,rng[i][1]);
    if(hi>lo) sum+=hi-lo;
  }
  return sum;
}
function deckungsluecke(a,b,rng){ return Math.max(0,(b-a)-ueberlappung(a,b,rng)); }
function abziehen(rng,weg){
  var out=[];
  for(var i=0;i<rng.length;i++){
    var teile=[[rng[i][0],rng[i][1]]];
    for(var j=0;j<weg.length;j++){
      var neu=[];
      for(var k=0;k<teile.length;k++){
        var t=teile[k], w=weg[j];
        if(w[1]<=t[0]||w[0]>=t[1]){ neu.push(t); continue; }
        if(w[0]>t[0]) neu.push([t[0],w[0]]);
        if(w[1]<t[1]) neu.push([w[1],t[1]]);
      }
      teile=neu;
    }
    out=out.concat(teile);
  }
  return out;
}
function typName(t){
  return t==="arbeit"?"Arbeitszeit":t==="pause"?"Pause":t==="dienstgang"?"Dienstgang":t==="privat"?"private Unterbrechung":String(t);
}

/* =========================================================================
   berechneTag — exakt nach Abschnitt 3 des Regelwerks
   ========================================================================= */
function berechneTag(key, tag, e, opt){
  opt = opt || {};
  tag = tag || {};
  var jetztMin = (opt.jetztMin===undefined||opt.jetztMin===null) ? null : opt.jetztMin;
  var dow = dateOf(key).getDay();
  var tagessoll = tagessollBerechnet(e);
  var ftName = feiertagName(key, e.land);
  var istArbeitstag = !!e.arbeitstage[dow];
  var autoArt = ftName ? "feiertag" : (istArbeitstag ? "arbeit" : "wochenende");
  var art = tag.art || autoArt;
  if(!ARTEN[art]) art = autoArt;
  var manuell = !!tag.art && tag.art !== autoArt;

  var warn = [];
  function w(t,txt){ warn.push({typ:t,text:txt}); }

  /* --- 1. Intervalle auflösen --- */
  var roh = tag.intervalle || [];
  var iv = [], offen=false;
  for(var i=0;i<roh.length;i++){
    var x=roh[i];
    var a=parseZeit(x.von), b=(x.bis===null||x.bis===undefined||x.bis==="")?null:parseZeit(x.bis);
    if(a===null && b===null) continue;
    if(a===null){ w("warn","Beginn fehlt bei "+typName(x.typ)+" (bis "+fmtUhr(b)+")."); continue; }
    if(b===null){
      offen = true;
      if(jetztMin!==null){ b=Math.max(a,jetztMin); }
      else { w("warn","Offene "+typName(x.typ)+"-Buchung — das Ende fehlt."); b=a; }
    } else if(b<a){
      w("warn","Ende vor Beginn bei "+typName(x.typ)+" ("+fmtUhr(a)+"–"+fmtUhr(b)+") — nicht gewertet.");
      b=a;
    }
    iv.push({typ:x.typ,a:a,b:b,idx:i});
  }
  function vonTyp(t){ return iv.filter(function(x){return x.typ===t;}); }
  function summe(l){ var s=0; for(var q=0;q<l.length;q++) s+=l[q].b-l[q].a; return s; }
  var arbIv=vonTyp("arbeit"), pauIv=vonTyp("pause"), dgIv=vonTyp("dienstgang"), privIv=vonTyp("privat");
  pauIv.sort(function(a,b){return a.a-b.a;});

  /* --- 2. Brutto-Anwesenheit --- */
  var arbRng = verschmelze(arbIv.map(function(x){return [x.a,x.b];}));
  var dgAussen = 0;
  for(var d1=0; d1<dgIv.length; d1++){
    dgAussen += (dgIv[d1].b - dgIv[d1].a) - ueberlappung(dgIv[d1].a, dgIv[d1].b, arbRng);
  }
  var korrList = tag.korrekturen || [], korrSum = 0;
  for(var kk=0; kk<korrList.length; kk++) korrSum += Math.round(korrList[kk].min||0);
  var arbSum = summe(arbIv);
  var brutto = arbSum + dgAussen + korrSum;

  /* --- 3. Private Unterbrechungen abziehen --- */
  var privSum = summe(privIv);
  brutto -= privSum;
  if(brutto<0) brutto=0;

  /* --- 4. Pausenabzug --- */
  var gebucht = summe(pauIv);
  var stufen = (e.pausenstufen||[]).slice().sort(function(a,b){return a.grenze-b.grenze;});
  /* Die Mindestpause laeuft AB der jeweiligen Grenze, sie wird nicht pauschal abgezogen.
     Die Grenze bezieht sich auf die Arbeitszeit, liegt in der Anwesenheit also um die
     bereits verbrauchte Pause spaeter. Beispiel 6-Stunden-Stufe: wer 6:01 anwesend ist,
     verbraucht davon 1 Minute Pause (Arbeitszeit 6:00) — nicht 30 Minuten. */
  var pflicht = 0, bisher = 0;
  for(var s1=0; s1<stufen.length; s1++){
    var zusatz = stufen[s1].pause - bisher;
    if(zusatz <= 0) continue;
    var pos = stufen[s1].grenze + bisher;   /* Zeitpunkt in der Anwesenheit, an dem die Grenze erreicht ist */
    if(brutto > pos) pflicht += Math.min(zusatz, brutto - pos);
    bisher = stufen[s1].pause;
  }
  var abzug = Math.max(gebucht, pflicht);

  var zuschlag = 0, zuschlagInfo = "";
  if(e.verspaetungszuschlag && arbIv.length && pauIv.length && pflicht>0){
    var beginn = Math.min.apply(null, arbIv.map(function(x){return x.a;}));
    for(var s2=0; s2<stufen.length; s2++){
      var st = stufen[s2];
      if(brutto <= st.grenze) continue;
      var grenzZeit = beginn + st.grenze;
      var antritt = null;
      if(s2===0){ antritt = pauIv[0].a; }
      else {
        var kum=0;
        for(var pi=0; pi<pauIv.length; pi++){
          kum += pauIv[pi].b - pauIv[pi].a;
          if(kum >= st.pause){ antritt = pauIv[pi].a; break; }
        }
      }
      if(antritt!==null && antritt > grenzZeit){
        var z = antritt - grenzZeit;
        if(z > zuschlag){ zuschlag = z; zuschlagInfo = "Pausenantritt "+fmtUhr(antritt)+", "+fmtDauer(st.grenze)+"-Grenze um "+fmtUhr(grenzZeit); }
      }
    }
  }
  abzug += zuschlag;

  /* --- 5. Netto und Kappung --- */
  var netto = brutto - abzug;
  if(netto<0) netto=0;
  var ueberGrenze = Math.max(0, netto - e.kappung);
  var gekappt = 0;
  if(e.kappungAn){ gekappt = ueberGrenze; netto = netto - gekappt; }

  /* --- 6. Soll / Ist / Saldo --- */
  var def = ARTEN[art];
  var soll = 0;
  if(def.sollFaktor>0) soll = (art==="arbeit" && !istArbeitstag) ? 0 : Math.round(tagessoll*def.sollFaktor);
  var gutschrift = Math.round(tagessoll*def.gutschrift);
  var ist = def.additiv ? (gutschrift + netto) : Math.max(gutschrift, netto);
  var saldo = ist - soll;

  /* Tage vor dem Stichtag zählen weder ins Konto noch in die Monatssumme (Abschnitt 2.6) */
  var vorStichtag = !!opt.vorStichtag;
  if(vorStichtag){ soll = 0; saldo = 0; }

  /* --- Warnungen und Hinweise --- */
  if(gekappt>0) w("warn","Arbeitszeit auf "+fmtDauer(e.kappung)+" h gekappt — "+fmtDauer(gekappt)+" h fallen weg.");
  else if(ueberGrenze>0) w("hinweis","Arbeitszeit "+fmtDauer(netto)+" h — über der Tagesgrenze von "+fmtDauer(e.kappung)+" h. Die Zeit wird voll gutgeschrieben.");
  /* Ist gar keine Pause gestempelt, wird die Mindestpause still automatisch abgezogen — keine Meldung.
     Nur eine tatsaechlich gestempelte, zu kurze Pause wird als ruhiger Hinweis vermerkt. */
  if(brutto>0 && gebucht>0 && gebucht < pflicht)
    w("hinweis","Gestempelte Pause ("+fmtDauer(gebucht)+" h) ist kürzer als die Mindestpause von "+fmtDauer(pflicht)+" h — abgezogen wurden "+fmtDauer(pflicht)+" h.");
  if(zuschlag>0) w("warn","Verspätungszuschlag "+fmtDauer(zuschlag)+" h — "+zuschlagInfo+".");
  if(offen && jetztMin!==null) w("hinweis","Eine Buchung läuft noch.");

  if(e.rahmenPruefung && istArbeitstag && !ftName){
    var rv=parseZeit(e.rahmenVon), rb=parseZeit(e.rahmenBis);
    if(rv!==null && rb!==null){
      var draussen=[];
      arbIv.concat(dgIv).forEach(function(x){ if(x.a<rv || x.b>rb) draussen.push(fmtUhr(x.a)+"–"+fmtUhr(x.b)); });
      if(draussen.length) w("hinweis","Buchung außerhalb der Rahmenzeit ("+fmtUhr(rv)+"–"+fmtUhr(rb)+"): "+draussen.join(", ")+".");
    }
  }
  if(e.kernzeitPruefung && art==="arbeit" && istArbeitstag && !ftName){
    var bloecke=(e.kernzeiten&&e.kernzeiten[String(dow)])||[];
    if(bloecke.length){
      var anwesend = abziehen(
        verschmelze(arbIv.concat(dgIv).map(function(x){return [x.a,x.b];})),
        verschmelze(privIv.map(function(x){return [x.a,x.b];}))
      );
      var fehlt=[];
      for(var b1=0;b1<bloecke.length;b1++){
        var kv=parseZeit(bloecke[b1].von), kb=parseZeit(bloecke[b1].bis);
        if(kv===null||kb===null||kb<=kv) continue;
        if(deckungsluecke(kv,kb,anwesend)>0) fehlt.push(fmtUhr(kv)+"–"+fmtUhr(kb));
      }
      if(fehlt.length && (arbIv.length||dgIv.length||korrSum))
        w("hinweis","Kernarbeitszeit nicht abgedeckt: "+fehlt.join(", ")+".");
    }
  }
  if(opt.vortagEnde!==null && opt.vortagEnde!==undefined && arbIv.length){
    var ersterBeginn=Math.min.apply(null,arbIv.map(function(x){return x.a;}));
    var ruhe = (1440 - opt.vortagEnde) + ersterBeginn;
    if(ruhe < e.ruhezeit)
      w("warn","Ruhezeit zum Vortag nur "+fmtDauer(ruhe)+" h (verlangt: "+fmtDauer(e.ruhezeit)+" h).");
  }

  var kommen = arbIv.length ? Math.min.apply(null,arbIv.map(function(x){return x.a;})) : null;
  var gehen = null;
  if(arbIv.length){
    var alleZu = true;
    for(var g=0; g<roh.length; g++)
      if(roh[g].typ==="arbeit" && (roh[g].bis===null||roh[g].bis===undefined||roh[g].bis==="")) alleZu=false;
    if(alleZu) gehen = Math.max.apply(null,arbIv.map(function(x){return x.b;}));
  }

  return {
    key:key, dow:dow, art:art, autoArt:autoArt, artManuell:manuell, artName:def.name,
    feiertag:ftName, istArbeitstag:istArbeitstag, tagessoll:tagessoll,
    kommen:kommen, gehen:gehen, offen:offen,
    arbeitSumme:arbSum, dienstgangAussen:dgAussen, dienstgangSumme:summe(dgIv),
    korrektur:korrSum, korrekturen:korrList, privat:privSum,
    brutto:brutto, gebuchtePause:gebucht, pflichtPause:pflicht, zuschlag:zuschlag, zuschlagInfo:zuschlagInfo,
    pauseAutomatisch:(gebucht===0 && pflicht>0),
    abzug:abzug, gekappt:gekappt, netto:netto, gutschrift:gutschrift,
    soll:soll, ist:ist, saldo:saldo, vorStichtag:vorStichtag,
    pausen:pauIv, dienstgaenge:dgIv, privatIv:privIv, arbeitIv:arbIv,
    warnungen:warn,
    hatDaten:(roh.length>0 || korrList.length>0 || !!tag.art || !!tag.notiz)
  };
}

/* letztes Anwesenheitsende eines Tages — für die Ruhezeitprüfung */
function letztesEnde(tag){
  if(!tag||!tag.intervalle) return null;
  var max=null;
  tag.intervalle.forEach(function(x){
    if(x.typ!=="arbeit"&&x.typ!=="dienstgang") return;
    var b=parseZeit(x.bis); if(b===null) return;
    if(max===null||b>max) max=b;
  });
  return max;
}

if(typeof module!=="undefined" && module.exports){
  module.exports={parseZeit:parseZeit,parseDauer:parseDauer,fmtUhr:fmtUhr,fmtDauer:fmtDauer,fmtSaldo:fmtSaldo,
    berechneTag:berechneTag,standardEinstellungen:standardEinstellungen,tagessollBerechnet:tagessollBerechnet,
    feiertage:feiertage,feiertagName:feiertagName,ostersonntag:ostersonntag,ARTEN:ARTEN,keyOf:keyOf,
    dateOf:dateOf,letztesEnde:letztesEnde,isoWocheKey:isoWocheKey,LAENDER:LAENDER};
}
</script>

<script id="app">
"use strict";
(function(){

        if(!Array.isArray(std.pausenstufen)||!std.pausenstufen.length) std.pausenstufen=standardEinstellungen().pausenstufen;
        /* Fassung 2: Meldungen zur Kernarbeitszeit einmalig abschalten, auch bei aelterem Bestand */
        if(!p.version || p.version < 2) std.kernzeitPruefung = false;
        s.einstellungen=std;
      }
    }catch(err){
      zeigeBanner("Die gespeicherten Daten konnten nicht gelesen werden — es wurde mit einem leeren Bestand gestartet.");
    }
  } else {
    /* Erststart: ab heute zählen, damit zurückliegende Tage ohne Buchung kein Minus erzeugen */
    s.einstellungen.stichtag = keyOf(new Date());
  }

}
function speichern(){
  seq++;

  try{ window.localStorage.setItem(KEY, JSON.stringify(state)); }

    speicherOk=false;

}
function E(){ return state.einstellungen; }
function tagObj(key,anlegen){
  if(!state.tage[key] && anlegen) state.tage[key]={intervalle:[],korrekturen:[]};
  var t=state.tage[key];
  if(t){ if(!t.intervalle) t.intervalle=[]; if(!t.korrekturen) t.korrekturen=[]; }
  return t||null;
}
function aufraeumen(key){
  var t=state.tage[key];
  if(!t) return;
  if((!t.intervalle||!t.intervalle.length) && (!t.korrekturen||!t.korrekturen.length) && !t.art && !t.notiz) delete state.tage[key];
}

/* =========================================================================
   Berechnung mit Kontext
   ========================================================================= */
function heuteKey(){ return keyOf(new Date()); }
function jetztMinuten(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function tagRechnung(key){
  var v=dateOf(key); v.setDate(v.getDate()-1);
  var st=E().stichtag;
  return berechneTag(key, state.tage[key]||null, E(), {
    jetztMin: (key===heuteKey()? jetztMinuten() : null),
    vortagEnde: letztesEnde(state.tage[keyOf(v)]),
    vorStichtag: !!(st && key < st)
  });
}
var _kontoCache={};
function kontostandBis(bisKey){
  if(_kontoCache[bisKey]!==undefined) return _kontoCache[bisKey];
  var e=E(), hk=heuteKey();
  var ende = bisKey<hk ? bisKey : hk;
  var summe=e.startKonto||0;
  if(e.stichtag){
    var d=dateOf(e.stichtag), endD=dateOf(ende), n=0;
    while(d<=endD && n<4000){
      summe += tagRechnung(keyOf(d)).saldo;
      d.setDate(d.getDate()+1); n++;
    }
  }
  _kontoCache[bisKey]=summe;
  return summe;
}
function monatsTage(jahr,monat){
  var out=[], n=tageImMonat(jahr,monat);
  for(var t=1;t<=n;t++) out.push(jahr+"-"+pad2(monat+1)+"-"+pad2(t));
  return out;
}
function monatsBilanz(jahr,monat){
  var keys=monatsTage(jahr,monat), hk=heuteKey();
  var b={soll:0,ist:0,saldo:0,urlaub:0,krank:0,gleit:0,dienstgang:0,pause:0,tage:[],warnungen:[],maxAbs:0,kuenftig:false};
  var wochen={};
  keys.forEach(function(k){
    var r=tagRechnung(k);
    b.tage.push(r);
    if(k<=hk){
      b.soll+=r.soll; b.ist+=r.ist; b.saldo+=r.saldo;
      b.dienstgang+=r.dienstgangSumme; b.pause+=r.gebuchtePause;
      if(r.art==="urlaub") b.urlaub+=1; else if(r.art==="urlaub_halb") b.urlaub+=0.5;
      if(r.art==="krank") b.krank+=1;
      if(r.art==="gleittag") b.gleit+=1; else if(r.art==="gleittag_halb") b.gleit+=0.5;
      var wk=isoWocheKey(dateOf(k));
      wochen[wk]=(wochen[wk]||0)+r.netto;
    } else b.kuenftig=true;
    if(Math.abs(r.saldo)>b.maxAbs) b.maxAbs=Math.abs(r.saldo);
    r.warnungen.forEach(function(x){ b.warnungen.push({key:k,typ:x.typ,text:x.text}); });
  });
  for(var wk2 in wochen){
    if(wochen[wk2]>E().maxWoche)
      b.warnungen.push({key:null,typ:"warn",text:"Wochenarbeitszeit in "+wk2.split("-")[1]+" bei "+fmtDauer(wochen[wk2])+" h — über der Warngrenze von "+fmtDauer(E().maxWoche)+" h."});
  }
  return b;
}
function kontoWarnungen(){
  var st=kontostandBis(heuteKey()), e=E(), out=[];
  if(st < -e.kontoMinus) out.push("Zeitschuld "+fmtSaldo(st)+" h — unter der Grenze von −"+fmtDauer(e.kontoMinus)+" h.");
  if(st > e.kontoPlus) out.push("Zeitguthaben "+fmtSaldo(st)+" h — über der Grenze von +"+fmtDauer(e.kontoPlus)+" h (im Original monatliche Kappung).");
  return out;
}

/* =========================================================================

  warnAuf:undefined, legendeAuf:false, einstOffen:{}};

    navs[i].classList.toggle("aktiv", navs[i].getAttribute("data-nav")===seite);
  ansicht._frisch=true;

}

/* =========================================================================
   Zeichnen
   ========================================================================= */
var view=document.getElementById("view");
function esc(s){
  return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function zeichne(){

  if(ansicht.seite==="stempel") zeichneStempel();
  else if(ansicht.seite==="info") zeichneInfo();

/* =========================================================================
   Animationen: Scroll-Reveal und zaehlende Kennzahlen
   ========================================================================= */
function reduzierteBewegung(){
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
var _io=null;
function revealInit(){
  var els=document.querySelectorAll(".reveal:not(.in)");
  if(!els.length) return;
  if(reduzierteBewegung() || !("IntersectionObserver" in window)){
    for(var i=0;i<els.length;i++) els[i].classList.add("in");
    return;
  }
  if(_io) _io.disconnect();
  _io=new IntersectionObserver(function(eintraege){
    eintraege.forEach(function(x){
      if(x.isIntersecting){ x.target.classList.add("in"); _io.unobserve(x.target); }
    });
  },{threshold:.1,rootMargin:"0px 0px -10% 0px"});
  for(var j=0;j<els.length;j++) _io.observe(els[j]);
}
function animWert(el,ziel,fmt){
  var start=null, dauer=700;
  function schritt(ts){
    if(start===null) start=ts;
    var t=Math.min(1,(ts-start)/dauer);
    var eased=1-Math.pow(1-t,3);
    var v=Math.round(ziel*eased);
    el.textContent=(fmt==="saldo"?fmtSaldo(v):fmtDauer(v))+" h";
    if(t<1) window.requestAnimationFrame(schritt);
  }
  window.requestAnimationFrame(schritt);
}
function animKacheln(){
  if(reduzierteBewegung()) return;
  var els=document.querySelectorAll(".kacheln .v[data-min]");
  for(var i=0;i<els.length;i++)
    animWert(els[i], parseInt(els[i].getAttribute("data-min"),10)||0, els[i].getAttribute("data-fmt"));
}

/* Scroll-gekoppeltes Hereinrollen: der Fortschritt haengt direkt an der
   Scroll-Position — die Karten rollen beim Wischen nacheinander ins Bild. */
var _rollEls=[], _rollGebunden=false;
function rollInit(){
  _rollEls=Array.prototype.slice.call(document.querySelectorAll(".rollin"));
  if(reduzierteBewegung()){
    _rollEls.forEach(function(el){ el.style.opacity="1"; el.style.transform="none"; });
    _rollEls=[];
  }
  if(!_rollGebunden){
    window.addEventListener("scroll", rollTick, {passive:true});
    window.addEventListener("resize", rollTick, {passive:true});
    _rollGebunden=true;
  }
  rollTick();
}
function rollTick(){
  var hint=document.getElementById("scrollHint");
  if(hint){
    var scrollbar=document.documentElement.scrollHeight > window.innerHeight+40;
    hint.style.opacity=(scrollbar && window.scrollY<60)?"1":"0";
  }
  if(!_rollEls.length) return;
  window.requestAnimationFrame(function(){
    var vh=window.innerHeight;
    var amEnde=(window.scrollY+vh)>=(document.documentElement.scrollHeight-8);
    for(var i=0;i<_rollEls.length;i++){
      var el=_rollEls[i];
      if(!el.isConnected) continue;
      var top=el.getBoundingClientRect().top;
      /* 0 = Oberkante am unteren Rand, 1 = Oberkante bei 45 % der Hoehe */
      var p=(vh-top)/(vh*0.55);
      if(amEnde) p=1;
      p=Math.max(0,Math.min(1,p));
      var e2=1-Math.pow(1-p,3);
      el.style.opacity=String(Math.min(1,0.04+0.96*e2));
      el.style.transform="perspective(1100px) translateY("+Math.round((1-e2)*90)+"px) rotateX("+((1-e2)*13).toFixed(2)+"deg) scale("+(0.94+0.06*e2).toFixed(4)+")";
    }
  });
}

/* ---------- Seite 1: Stempeluhr ---------- */
var SVG={
  kommen:'<svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 8l4 4-4 4"/><path d="M14 12H3"/></svg>',
  gehen:'<svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',

};
function begruessung(){
  var h=new Date().getHours();
  var g = h<5?"Gute Nacht":h<11?"Guten Morgen":h<14?"Mahlzeit":h<18?"Guten Tag":"Guten Abend";
  var n=(E().name||"").trim().split(" ")[0];

}
/* Tagessalden der letzten 14 Tage als Mini-Verlauf */
function sparkHtml(){
  var tage=[], max=60;
  for(var i=13;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=keyOf(d), r=tagRechnung(k);
    var frei=(r.dow===0||r.dow===6||r.art==="wochenende"||r.art==="feiertag");
    tage.push({key:k,saldo:r.saldo,frei:frei,dow:r.dow});
    if(Math.abs(r.saldo)>max) max=Math.abs(r.saldo);
  }
  var h='<div class="spark noprint">';
  tage.forEach(function(t){
    var hpx=Math.max(4,Math.round(Math.abs(t.saldo)/max*30));
    var cls=(t.frei&&!t.saldo)?"w":(t.saldo>=0?"p":"m");
    h+='<span class="sp-t" title="'+esc(WT_KURZ[t.dow])+' '+esc(fmtDatumKurz(t.key))+' · '+esc(fmtSaldo(t.saldo))+' h">'
      +'<i class="'+cls+' '+(t.saldo>=0?"oben":"unten")+'" style="height:'+hpx+'px"></i></span>';
  });
  return h+'</div><div class="spark-label noprint">Tagessalden der letzten 14 Tage</div>';
}
function zeichneStempel(){
  var hk=heuteKey(), r=tagRechnung(hk);
  var kw=kontoWarnungen();

function offenesIv(typ){
  var t=state.tage[heuteKey()];
  if(!t||!t.intervalle) return -1;
  for(var i=t.intervalle.length-1;i>=0;i--){
    var x=t.intervalle[i];
    if(x.typ===typ && (x.bis===null||x.bis===undefined||x.bis==="")) return i;
  }
  return -1;
}
var undoDaten=null, undoTimer=null;
function merkeUndo(text){
  var hk=heuteKey();
  undoDaten={key:hk, snapshot:JSON.stringify(state.tage[hk]||null)};
  var t=document.getElementById("toast");
  t.innerHTML='<span>'+esc(text)+'</span><button id="undoBtn">Rückgängig</button>';
  t.className="an";
  document.getElementById("undoBtn").addEventListener("click", function(){
    if(!undoDaten) return;
    var snap=JSON.parse(undoDaten.snapshot);
    if(snap===null) delete state.tage[undoDaten.key]; else state.tage[undoDaten.key]=snap;
    speichern(); undoDaten=null; t.className=""; zeichne();
  });
  if(undoTimer) clearTimeout(undoTimer);
  undoTimer=setTimeout(function(){ t.className=""; undoDaten=null; }, 60000);
}
function buchen(akt, btn){
  var hk=heuteKey(), jetzt=fmtUhr(jetztMinuten());
  var t=tagObj(hk,true), txt="", i;
  if(akt==="kommen"){
    if(offenesIv("arbeit")>=0) return;
    t.intervalle.push({typ:"arbeit",von:jetzt,bis:null}); txt="Kommen "+jetzt+" gebucht.";
  } else if(akt==="gehen"){
    i=offenesIv("arbeit"); if(i<0) return;
    t.intervalle[i].bis=jetzt; txt="Gehen "+jetzt+" gebucht.";
  } else if(akt==="pause"){
    i=offenesIv("pause");
    if(i>=0){ t.intervalle[i].bis=jetzt; txt="Pause beendet um "+jetzt+"."; }
    else { t.intervalle.push({typ:"pause",von:jetzt,bis:null}); txt="Pause begonnen um "+jetzt+"."; }
  } else if(akt==="dienstgang"){
    i=offenesIv("dienstgang");
    if(i>=0){ t.intervalle[i].bis=jetzt; txt="Dienstgang beendet um "+jetzt+"."; }
    else { t.intervalle.push({typ:"dienstgang",von:jetzt,bis:null}); txt="Dienstgang begonnen um "+jetzt+"."; }
  }
  merkeUndo(txt);
  speichern();
  if(btn){ btn.classList.remove("blitz"); void btn.offsetWidth; btn.classList.add("blitz"); }
  tick();
  var kg=document.getElementById("kontoGross");
  if(kg){ var k=kontostandBis(hk); kg.textContent=fmtSaldo(k); kg.className="gross "+(k>0?"p":k<0?"m":""); }
}

/* Rechnerischer Feierabend inklusive noch fälliger Pflichtpause */
function feierabend(hk){
  var t=state.tage[hk];
  if(!t) return null;
  var i=offenesIv("arbeit");
  if(i<0) return null;
  var kopie=JSON.parse(JSON.stringify(t));
  var start=Math.max(jetztMinuten(), parseZeit(kopie.intervalle[i].von)||0);
  for(var ende=start; ende<=1440; ende++){
    kopie.intervalle[i].bis=fmtUhr(ende);
    var rr=berechneTag(hk, kopie, E(), {jetztMin:null, vortagEnde:null});
    if(rr.ist>=rr.soll) return ende;
  }
  return null;
}

function tick(){
  var sk=document.getElementById("statuskarte");
  if(!sk) return;
  var hk=heuteKey(), now=new Date();
  var r=tagRechnung(hk);
  var oA=offenesIv("arbeit"), oP=offenesIv("pause"), oD=offenesIv("dienstgang");
  var zustand="Nicht eingestempelt", z="";
  if(oP>=0){ zustand="Pause"; z="pause"; }
  else if(oD>=0){ zustand="Dienstgang"; z="dienstgang"; }
  else if(oA>=0){ zustand="Arbeitszeit läuft"; z="arbeit"; }

  var t=state.tage[hk], letzte=null;
  if(t&&t.intervalle) t.intervalle.forEach(function(x){
    var a=parseZeit(x.von), b=(x.bis?parseZeit(x.bis):null);
    if(a!==null&&(letzte===null||a>letzte)) letzte=a;
    if(b!==null&&(letzte===null||b>letzte)) letzte=b;
  });
  var seitTxt="Heute noch keine Buchung.";
  if(letzte!==null){
    var sek=(now.getHours()*3600+now.getMinutes()*60+now.getSeconds())-letzte*60;
    if(sek<0) sek=0;
    seitTxt="Seit der letzten Buchung ("+fmtUhr(letzte)+"): "+Math.floor(sek/3600)+":"+pad2(Math.floor((sek%3600)/60))+":"+pad2(sek%60);
  }
  sk.setAttribute("data-z",z);
  var setz=function(id,txt){ var el=document.getElementById(id); if(el && el.textContent!==txt) el.textContent=txt; };
  setz("zustandTxt",zustand);
  setz("uhrTxt", pad2(now.getHours())+":"+pad2(now.getMinutes())+":"+pad2(now.getSeconds()));
  setz("seitTxt", seitTxt);

  /* Fortschrittsring: Tages-Ist im Verhaeltnis zum Soll (Umfang 2*PI*52 = 326,7) */
  var rf=document.getElementById("ringFill");
  if(rf){
    var pct = r.soll>0 ? Math.min(1, r.ist/r.soll) : (r.ist>0?1:0);
    rf.style.strokeDashoffset = String(326.7*(1-pct));
    rf.classList.toggle("voll", r.soll>0 && r.ist>=r.soll);
    setz("ringPct", Math.round(pct*100)+"%");
    setz("ringSub", r.soll>0 ? (r.ist>=r.soll?"Soll erreicht":"vom Tagessoll") : "kein Soll heute");
  }

  var kn=document.querySelector('[data-akt="kommen"]');
  if(kn){
    var ge=document.querySelector('[data-akt="gehen"]'),
        pa=document.querySelector('[data-akt="pause"]'),
        dg=document.querySelector('[data-akt="dienstgang"]');
    kn.disabled = oA>=0;
    ge.disabled = !(oA>=0) || oP>=0 || oD>=0;
    pa.disabled = !(oA>=0) || oD>=0;
    dg.disabled = oP>=0;
    kn.title = kn.disabled ? "Es läuft bereits eine Arbeitszeit." : "";
    ge.title = ge.disabled ? (oA<0?"Zuerst „Kommen“ buchen.":"Zuerst Pause bzw. Dienstgang beenden.") : "";
    pa.title = pa.disabled ? (oA<0?"Pause erst nach „Kommen“ möglich.":"Zuerst den Dienstgang beenden.") : "";
    dg.title = dg.disabled ? "Zuerst die Pause beenden." : "";
    document.getElementById("pauseTxt").textContent = oP>=0?"Pause beenden":"Pause";
    document.getElementById("dgTxt").textContent = oD>=0?"Dienstgang beenden":"Dienstgang";
  }

  var hb=document.getElementById("heuteBox");
  if(hb){
    var rest=r.soll-r.ist, fa=feierabend(hk);
    var neu=
       '<div><div class="k">Bisher gearbeitet</div><div class="v">'+fmtDauer(r.ist)+' h</div></div>'
      +'<div><div class="k">Pause bisher</div><div class="v">'+fmtDauer(r.gebuchtePause)+' h</div></div>'
      +'<div><div class="k">Bis Tagessoll</div><div class="v">'+(rest>0?fmtDauer(rest)+" h":"erfüllt")+'</div></div>'
      +'<div><div class="k">Rechn. Feierabend</div><div class="v">'+(rest<=0?"erreicht":(fa!==null?fmtUhr(fa):"—"))+'</div></div>';
    if(hb.getAttribute("data-h")!==neu){ hb.innerHTML=neu; hb.setAttribute("data-h",neu); }
    var hh=document.getElementById("heuteHinweise");
    var neuH = r.warnungen.length
      ? r.warnungen.map(function(x){ return '<li class="'+(x.typ==="warn"?"w":"i")+'"><span class="sym">'+(x.typ==="warn"?"!":"i")+'</span><span>'+esc(x.text)+'</span></li>'; }).join("")
      : '<li class="i"><span class="sym">✓</span><span>Keine Hinweise für heute.</span></li>';
    if(hh.getAttribute("data-h")!==neuH){ hh.innerHTML=neuH; hh.setAttribute("data-h",neuH); }
  }
}
