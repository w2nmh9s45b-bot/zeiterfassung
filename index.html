  var h='<details class="acc'+(ernst?' acc-warn':'')+'" id="warnAcc"'+(auf?' open':'')+' style="margin-bottom:14px">'
    +'<summary><span class="acc-ico">'+(ernst?"!":"i")+'</span>Hinweise und Warnungen'
    +'<span class="zaehler">'+n+'</span><span class="chev"></span></summary><div class="acc-body"><ul class="hinweise">';
  kw.forEach(function(t){ h+='<li class="w"><span class="sym">!</span><span>'+esc(t)+'</span></li>'; });
  b.warnungen.forEach(function(x){
    h+='<li class="'+(x.typ==="warn"?"w":"i")+'"><span class="sym">'+(x.typ==="warn"?"!":"i")+'</span><span>'
      +(x.key?'<strong>'+esc(fmtDatumKurz(x.key))+'</strong> ':'')+esc(x.text)+'</span>'
      +(x.key?'<button class="noprint" data-spring="'+x.key+'">zum Tag</button>':'')+'</li>';
  });
  return h+'</ul></div></details>';
}
/* Farbliche Kennzeichnung der Zeile.
   Reihenfolge zaehlt: Wochenende schlaegt alles, dann abwesende Tage, erst danach der Saldo. */
function zeilenFarbe(r){
  if(r.dow===0 || r.dow===6 || r.art==="wochenende") return "z-blau";
  if(r.art!=="arbeit") return "z-gelb";          /* Urlaub, Krank, Feiertag, Gleittag, Fortbildung, Sonderurlaub */
  if(r.vorStichtag) return "";                   /* zaehlt nicht ins Konto */
  if(r.key>heuteKey()) return "";                /* kuenftige Tage nicht vorab rot faerben */
  return r.saldo>=0 ? "z-gruen" : "z-rot";
}
function zeilenKlassen(r){
  var frei=(r.art==="wochenende"||r.art==="feiertag");
  return (frei?"frei ":"")+(r.key===heuteKey()?"tag-heute ":"")+zeilenFarbe(r);
}
/* Tage des Monats in Kalenderwochen buendeln (nur die Tage, die im Monat liegen) */
function wochenBloecke(tage){
  var out=[], akt=null;
  tage.forEach(function(r){
    var wk=isoWocheKey(dateOf(r.key));
    if(!akt || akt.wk!==wk){ akt={wk:wk, tage:[]}; out.push(akt); }
    akt.tage.push(r);
  });
  return out;
}
function wochenSumme(bl){
  var hk=heuteKey(), s={ist:0,soll:0,saldo:0,gezaehlt:0};
  bl.tage.forEach(function(r){
    if(r.key<=hk){ s.ist+=r.ist; s.soll+=r.soll; s.saldo+=r.saldo; s.gezaehlt++; }
  });
  return s;
}
function wochenZellen(bl){
  var s=wochenSumme(bl);
  var von=bl.tage[0].key, bis=bl.tage[bl.tage.length-1].key;
  var kw=bl.wk.split("-")[1];
  var saldoTxt = s.gezaehlt
    ? '<span class="'+(s.saldo>0?"p":s.saldo<0?"m":"")+'">'+fmtSaldo(s.saldo)+'</span>'
    : '–';
  return '<td>'+esc(kw)+'</td><td></td>'
   +'<td colspan="9">Wochensumme '+esc(fmtDatumKurz(von))+' – '+esc(fmtDatumKurz(bis))+'</td>'
   +'<td class="r">'+(s.gezaehlt?fmtDauer(s.ist):"–")+'</td>'
   +'<td class="r">'+(s.gezaehlt?fmtDauer(s.soll):"–")+'</td>'
   +'<td class="r">'+saldoTxt+'</td><td></td>';
}
function wochenZeile(bl){
  return '<tr class="wochenzeile" data-woche="'+bl.wk+'">'+wochenZellen(bl)+'</tr>';
}
function zeile(r,maxAbs){
  var t=state.tage[r.key]||{};
  var cls=zeilenKlassen(r);
  var p1=r.pausen[0], d1=r.dienstgaenge[0];
  var extraP=r.pausen.length>1?'<span class="mark" title="'+r.pausen.length+' Pausen — im Tagesdetail">+'+(r.pausen.length-1)+'</span>':'';
  var extraD=r.dienstgaenge.length>1?'<span class="mark" title="'+r.dienstgaenge.length+' Dienstgänge — im Tagesdetail">+'+(r.dienstgaenge.length-1)+'</span>':'';
  var warnMark=r.warnungen.some(function(x){return x.typ==="warn";})?'<span class="mark" title="Warnung — Tagesdetail öffnen">!</span>':'';
  return '<tr data-key="'+r.key+'" class="'+cls+'">'
   +'<td>'+fmtDatum(r.key)+'</td>'
   +'<td>'+WT_KURZ[r.dow]+'</td>'
   +'<td class="c-art">'+artZelle(r,warnMark)+'</td>'
   +'<td>'+inp(r.key,"kommen",r.kommen)+'</td>'
   +'<td>'+inp(r.key,"gehen",r.gehen)+'</td>'
   +'<td style="white-space:nowrap">'+inp(r.key,"pauseVon",p1?p1.a:null)+'<span class="bis">–</span>'+inp(r.key,"pauseBis",p1?p1.b:null)+extraP+'</td>'
   +'<td class="r calc c-pause">'+(r.gebuchtePause?fmtDauer(r.gebuchtePause):"")+'</td>'
   +'<td style="white-space:nowrap">'+inp(r.key,"dgVon",d1?d1.a:null)+'<span class="bis">–</span>'+inp(r.key,"dgBis",d1?d1.b:null)+extraD+'</td>'
   +'<td class="r calc c-dg">'+(r.dienstgangSumme?fmtDauer(r.dienstgangSumme):"")+'</td>'
   +'<td class="r calc c-brutto">'+bruttoZelle(r)+'</td>'
   +'<td class="r calc c-abzug">'+abzugZelle(r)+'</td>'
   +'<td class="r calc stark c-ist">'+((r.ist||r.hatDaten)?fmtDauer(r.ist):"")+'</td>'
   +'<td class="r calc c-soll">'+sollZelle(r)+'</td>'
   +'<td class="r c-saldo">'+saldoZelle(r,maxAbs)+'</td>'
   +'<td class="c-notiz">'+notizZelle(r.key,t)+'</td></tr>';
}
function artZelle(r,warnMark){
  return '<button class="artbtn" data-detail="'+r.key+'" title="'+esc(r.feiertag||r.artName)+' — Tagesdetail öffnen">'
    +esc(r.feiertag||r.artName)+(r.artManuell?'<span class="stift">✎</span>':'')+(warnMark||'')+'</button>';
}
function notizZelle(key,t){
  return '<button class="notizbtn" data-detail="'+key+'" title="Tagesdetail öffnen">'+(t.notiz?esc(t.notiz):'<span class="n-leer">+ Notiz</span>')+'</button>';
}
function bruttoZelle(r){
  return (r.brutto?fmtDauer(r.brutto):"")
    +(r.korrektur?'<span class="mark" title="Zeitkorrektur '+fmtSaldo(r.korrektur)+' h">K</span>':"")
    +(r.privat?'<span class="mark" title="private Unterbrechung '+fmtDauer(r.privat)+' h abgezogen">P</span>':"");
}
function abzugZelle(r){
  return (r.abzug?fmtDauer(r.abzug):"")
    +(r.gekappt?'<span class="mark" title="'+fmtDauer(r.gekappt)+' h gekappt">▲</span>':"");
}
function inp(key,feld,min){
  return '<input class="t" type="text" inputmode="numeric" autocomplete="off" data-key="'+key+'" data-feld="'+feld
    +'" value="'+(min===null||min===undefined?"":fmtUhr(min))+'" placeholder="––:––" aria-label="'+feld+' '+fmtDatum(key)+'">';
}
function ausserhalb(r){
  /* nur an Tagen markieren, die sonst ein Soll hätten — sonst reines Rauschen */
  return r.vorStichtag && r.istArbeitstag && r.art!=="wochenende" && r.art!=="feiertag";
}
function sollZelle(r){
  if(ausserhalb(r)) return '<span title="Liegt vor dem Stichtag — zählt nicht ins Konto.">–</span>';
  return r.soll?fmtDauer(r.soll):"";
}
function saldoZelle(r,maxAbs){
  if(ausserhalb(r)) return '<span class="calc" title="Liegt vor dem Stichtag — zählt nicht ins Konto.">–</span>';
  if(r.key>heuteKey()) return '<span class="calc" title="Liegt in der Zukunft — noch nicht gewertet.">–</span>';
  var m=Math.max(maxAbs,60);
  var w=Math.min(50, Math.abs(r.saldo)/m*50);
  var txt=(r.hatDaten||r.saldo)?'<span class="'+(r.saldo>0?"p":r.saldo<0?"m":"")+'" style="font-weight:600">'+fmtSaldo(r.saldo)+'</span>':'';
  var bar=Math.abs(r.saldo)>0
    ? '<span class="bar"><span class="bfill '+(r.saldo>=0?"p":"m")+'" style="'+(r.saldo>=0?"left:50%;":"right:50%;")+"width:"+w+'%"></span></span>'
    : '';
  return txt+bar;
}

function monatEvents(){
  var g=function(id){ return document.getElementById(id); };
  function neuMonat(){ ansicht._frisch=true; zeichneMonat(); }
  g("mPrev").addEventListener("click",function(){ ansicht.monat--; if(ansicht.monat<0){ansicht.monat=11;ansicht.jahr--;} neuMonat(); });
  g("mNext").addEventListener("click",function(){ ansicht.monat++; if(ansicht.monat>11){ansicht.monat=0;ansicht.jahr++;} neuMonat(); });
  g("mHeute").addEventListener("click",function(){ ansicht.jahr=new Date().getFullYear(); ansicht.monat=new Date().getMonth(); neuMonat(); });
  g("mSel").addEventListener("change",function(){ ansicht.monat=+this.value; neuMonat(); });
  g("jSel").addEventListener("change",function(){ var v=parseInt(this.value,10); if(v>1990&&v<2200){ansicht.jahr=v; neuMonat();} });
  g("btnDruck").addEventListener("click",function(){ window.print(); });
  g("btnCsv").addEventListener("click",csvExport);
  springLinks();
  var tb=g("tbody");
  tb.addEventListener("click",function(ev){
    var d=ev.target.closest?ev.target.closest("[data-detail]"):null;
    if(d) detailOeffnen(d.getAttribute("data-detail"));
  });
  tb.addEventListener("input",function(ev){
    if(ev.target.className.indexOf("t")>=0 && ev.target.tagName==="INPUT") feldSetzen(ev.target,false);
  });
  tb.addEventListener("change",function(ev){
    if(ev.target.className.indexOf("t")>=0 && ev.target.tagName==="INPUT") feldSetzen(ev.target,true);
  });
}
function springLinks(){
  var xs=document.querySelectorAll("[data-spring]");
  for(var i=0;i<xs.length;i++)
    (function(x){ x.addEventListener("click",function(){ springeZu(x.getAttribute("data-spring")); }); })(xs[i]);
  /* Aufklapp-Zustaende ueberleben das Neuzeichnen */
  var wa=document.getElementById("warnAcc");
  if(wa) wa.addEventListener("toggle",function(){ ansicht.warnAuf=wa.open; });
  var la=document.getElementById("legendeAcc");
  if(la) la.addEventListener("toggle",function(){ ansicht.legendeAuf=la.open; });
}
function springeZu(key){
  var jr=parseInt(key.slice(0,4),10), mo=parseInt(key.slice(5,7),10)-1;
  if(jr!==ansicht.jahr||mo!==ansicht.monat){ ansicht.jahr=jr; ansicht.monat=mo; zeichneMonat(); }
  var tr=document.querySelector('tr[data-key="'+key+'"]');
  if(tr){
    tr.scrollIntoView({block:"center",behavior:"smooth"});
    tr.classList.remove("blink"); void tr.offsetWidth; tr.classList.add("blink");
  }
}

/* Tabellenfeld -> Zustand. Die Eingabefelder werden nie ersetzt, damit der Fokus bleibt. */
function feldSetzen(el, normalisieren){
  var key=el.getAttribute("data-key"), feld=el.getAttribute("data-feld");
  var roh=el.value.trim();
  var min = roh==="" ? null : parseZeit(roh);
  if(roh!=="" && min===null){ if(normalisieren) el.value=""; else return; }
  var t=tagObj(key,true);
  var wert = min===null ? null : fmtUhr(min);

  function idx(typ,welche){
    if(welche==="erster"){ for(var i=0;i<t.intervalle.length;i++) if(t.intervalle[i].typ===typ) return i; }
    else { for(var j=t.intervalle.length-1;j>=0;j--) if(t.intervalle[j].typ===typ) return j; }
    return -1;
  }
  function setze(typ, welche, teil){
    var i = idx(typ,welche);
    if(i<0){
      if(wert===null) return;
      var neu={typ:typ,von:null,bis:null}; neu[teil]=wert; t.intervalle.push(neu); return;
    }
    t.intervalle[i][teil]=wert;
    var x=t.intervalle[i];
    if((x.von===null||x.von==="") && (x.bis===null||x.bis==="")) t.intervalle.splice(i,1);
  }
  if(feld==="kommen") setze("arbeit","erster","von");
  else if(feld==="gehen") setze("arbeit","letzter","bis");
  else if(feld==="pauseVon") setze("pause","erster","von");
  else if(feld==="pauseBis") setze("pause","erster","bis");
  else if(feld==="dgVon") setze("dienstgang","erster","von");
  else if(feld==="dgBis") setze("dienstgang","erster","bis");

  aufraeumen(key);
  speichern();
  if(normalisieren) el.value = wert||"";
  livePatch(key);
}
function livePatch(key){
  var b=monatsBilanz(ansicht.jahr,ansicht.monat), r=null;
  for(var i=0;i<b.tage.length;i++) if(b.tage[i].key===key) r=b.tage[i];
  var tr=document.querySelector('tr[data-key="'+key+'"]');
  if(r&&tr){
    var q=function(s){ return tr.querySelector(s); };
    q(".c-pause").innerHTML  = r.gebuchtePause?fmtDauer(r.gebuchtePause):"";
    q(".c-dg").innerHTML     = r.dienstgangSumme?fmtDauer(r.dienstgangSumme):"";
    q(".c-brutto").innerHTML = bruttoZelle(r);
    q(".c-abzug").innerHTML  = abzugZelle(r);
    q(".c-ist").innerHTML    = (r.ist||r.hatDaten)?fmtDauer(r.ist):"";
    q(".c-soll").innerHTML   = sollZelle(r);
    q(".c-saldo").innerHTML  = saldoZelle(r,b.maxAbs);
    var wm=r.warnungen.some(function(x){return x.typ==="warn";})?'<span class="mark" title="Warnung — Tagesdetail öffnen">!</span>':'';
    q(".c-art").innerHTML    = artZelle(r,wm);
    tr.className             = zeilenKlassen(r);   /* Farbe sofort mitziehen */
  }
  /* Wochensummen neu rechnen, sonst stehen sie nach einer Aenderung falsch da */
  wochenBloecke(b.tage).forEach(function(bl){
    var wr=document.querySelector('tr[data-woche="'+bl.wk+'"]');
    if(wr) wr.innerHTML=wochenZellen(bl);
  });
  var kach=document.querySelector(".kacheln");
  if(kach) kach.innerHTML=kachelnHtml(b,kontostandBis(letzterTagKey()));
  var wb=document.getElementById("warnBox");
  if(wb){ wb.innerHTML=warnHtml(b,kontoWarnungen()); springLinks(); }
}

/* ---------- Jahresansicht ---------- */
function zeichneJahr(){
  var j=ansicht.jahr;
  var fx=ansicht._frisch?"reveal":"reveal in"; ansicht._frisch=false;
  var h='<div class="monatsleiste noprint '+fx+'">'
   +'<div class="mnav"><button class="btn rund" id="jPrev" aria-label="Vorjahr">‹</button>'
   +'<div class="titel">Jahr '+j+'</div>'
   +'<button class="btn rund" id="jNext" aria-label="Folgejahr">›</button></div></div>';
  h+='<div class="karte pad '+fx+'" style="--d:50ms"><table class="jahrtab"><thead><tr><th>Monat</th><th class="r">Soll</th><th class="r">Ist</th><th class="r">Saldo</th><th class="r">Kontostand Ende</th></tr></thead><tbody>';
  var sSoll=0,sIst=0,sSaldo=0;
  for(var m=0;m<12;m++){
    var b=monatsBilanz(j,m);
    var kst=kontostandBis(j+"-"+pad2(m+1)+"-"+pad2(tageImMonat(j,m)));
    sSoll+=b.soll; sIst+=b.ist; sSaldo+=b.saldo;
    var jetzt=(j===new Date().getFullYear()&&m===new Date().getMonth());
    h+='<tr class="'+(jetzt?"jetzt":"")+'"><td><button class="artbtn" data-monat="'+m+'" style="font-weight:inherit">'+MONATE[m]+'</button></td>'
      +'<td class="r">'+fmtDauer(b.soll)+'</td><td class="r">'+fmtDauer(b.ist)+'</td>'
      +'<td class="r '+(b.saldo>0?"p":b.saldo<0?"m":"")+'">'+fmtSaldo(b.saldo)+'</td>'
      +'<td class="r '+(kst>0?"p":kst<0?"m":"")+'">'+fmtSaldo(kst)+'</td></tr>';
  }
  h+='<tr style="border-top:2px solid var(--line-stark);font-weight:700"><td style="padding-left:8px">Summe '+j+'</td>'
    +'<td class="r">'+fmtDauer(sSoll)+'</td><td class="r">'+fmtDauer(sIst)+'</td>'
    +'<td class="r '+(sSaldo>0?"p":sSaldo<0?"m":"")+'">'+fmtSaldo(sSaldo)+'</td><td class="r">—</td></tr>';
  h+='</tbody></table><p class="hint">Kontostand = Anfangswert aus den Einstellungen zuzüglich aller Tagessalden ab dem Stichtag; künftige Tage bleiben unberücksichtigt.</p></div>';
  document.getElementById("infoInhalt").innerHTML=h;
  revealInit();
  document.getElementById("jPrev").addEventListener("click",function(){ ansicht.jahr--; ansicht._frisch=true; zeichneJahr(); });
  document.getElementById("jNext").addEventListener("click",function(){ ansicht.jahr++; ansicht._frisch=true; zeichneJahr(); });
  var ms=document.querySelectorAll("[data-monat]");
  for(var i=0;i<ms.length;i++)
    (function(a){ a.addEventListener("click",function(){ ansicht.monat=+a.getAttribute("data-monat"); ansicht.reiter="monat"; zeichneInfo(); }); })(ms[i]);
}

      }
      speichern(); detailZeichnen();
    });

  document.getElementById("korrAdd").addEventListener("click",function(){
    var t=tagObj(key,true); t.korrekturen.push({min:0,grund:""}); speichern(); detailZeichnen();
    var f=d.querySelectorAll('input[data-teil="min"]'); if(f.length) f[f.length-1].focus();
  });
  alle("[data-korrdel]",function(b){
    b.addEventListener("click",function(){
      var t=tagObj(key,true); t.korrekturen.splice(+b.getAttribute("data-korrdel"),1);
      aufraeumen(key); speichern(); detailZeichnen();
    });
  });
  alle("input[data-korr]",function(el){
    el.addEventListener("change",function(){
      var t=tagObj(key,true), i=+el.getAttribute("data-korr"), teil=el.getAttribute("data-teil");
      if(teil==="min"){
        var v=parseInt(String(el.value).replace(/[^\-0-9]/g,""),10);

      } else t.korrekturen[i].grund=el.value.trim();
      speichern(); detailZeichnen();
    });
  });
}

function einstellungenEvents(){
  var e=E();

  /* Aufklapp-Zustand je Karte merken, damit das Neuzeichnen nichts zuklappt */

    d.addEventListener("toggle",function(){ ansicht.einstOffen[d.getAttribute("data-sekt")]=d.open; });
  });

  alle('input[name="waz"]',function(r){
    r.addEventListener("change",function(){ if(r.value!=="frei") e.wochenarbeitszeit=parseInt(r.value,10); fertig(); });
  });
  g("wazFrei").addEventListener("change",function(){
    var v=parseDauer(this.value); if(v!==null&&v>0&&v<=7*1440) e.wochenarbeitszeit=v; fertig();
  });
  alle("[data-at]",function(c){
    c.addEventListener("change",function(){ e.arbeitstage[+c.getAttribute("data-at")]=c.checked; fertig(); });
  });
  g("tsAuto").addEventListener("change",function(){
    e.tagessollAuto=this.checked;
    if(!e.tagessollAuto) e.tagessoll=tagessollBerechnet(e);
    fertig();
  });
  g("tsWert").addEventListener("change",function(){ var v=parseDauer(this.value); if(v!==null&&v>=0) e.tagessoll=v; fertig(); });
  g("rahmenAn").addEventListener("change",function(){ e.rahmenPruefung=this.checked; fertig(false); });
  g("rahmenVon").addEventListener("change",function(){ var v=parseZeit(this.value); if(v!==null) e.rahmenVon=fmtUhr(v); fertig(); });
  g("rahmenBis").addEventListener("change",function(){ var v=parseZeit(this.value); if(v!==null) e.rahmenBis=fmtUhr(v); fertig(); });
  g("kernAn").addEventListener("change",function(){ e.kernzeitPruefung=this.checked; fertig(false); });
  alle("[data-kern]",function(el){
    el.addEventListener("change",function(){
      var d=+el.getAttribute("data-kern"), j=+el.getAttribute("data-j"), teil=el.getAttribute("data-teil");
      var v=parseZeit(el.value);
      if(v!==null) e.kernzeiten[String(d)][j][teil]=fmtUhr(v);
      fertig();

  alle("[data-kerndel]",function(b){
    b.addEventListener("click",function(){ e.kernzeiten[String(b.getAttribute("data-kerndel"))].splice(+b.getAttribute("data-j"),1); fertig(); });
  });
  alle("[data-kernadd]",function(b){
    b.addEventListener("click",function(){
      var k=String(b.getAttribute("data-kernadd"));
      if(!e.kernzeiten[k]) e.kernzeiten[k]=[];
      e.kernzeiten[k].push({von:"08:30",bis:"12:00"}); fertig();
    });
  });
  alle("[data-stufe]",function(el){
    el.addEventListener("change",function(){
      var i=+el.getAttribute("data-stufe"), teil=el.getAttribute("data-teil");
      if(teil==="grenze"){ var v=parseDauer(el.value); if(v!==null&&v>=0) e.pausenstufen[i].grenze=v; }
      else { var m=parseInt(String(el.value).replace(/[^0-9]/g,""),10); if(isFinite(m)) e.pausenstufen[i].pause=m; }
      fertig();
    });
  });
  alle("[data-stufedel]",function(b){
    b.addEventListener("click",function(){ e.pausenstufen.splice(+b.getAttribute("data-stufedel"),1); fertig(); });
  });
  g("stufeAdd").addEventListener("click",function(){ e.pausenstufen.push({grenze:720,pause:60}); fertig(); });
  g("vzAn").addEventListener("change",function(){ e.verspaetungszuschlag=this.checked; fertig(false); });
  g("kappAn").addEventListener("change",function(){ e.kappungAn=this.checked; fertig(false); });

  ["kappung","maxWoche","ruhezeit","kontoMinus","kontoPlus"].forEach(function(id){
    g(id).addEventListener("change",function(){ var v=parseDauer(this.value); if(v!==null&&v>=0) e[id]=v; fertig(); });
  });
  g("startKonto").addEventListener("change",function(){ var v=parseDauer(this.value); if(v!==null) e.startKonto=v; fertig(); });
  g("stichtag").addEventListener("change",function(){ e.stichtag=this.value; fertig(); });
  g("land").addEventListener("change",function(){ e.land=this.value; fertig(); });
  g("nameF").addEventListener("change",function(){ e.name=this.value.trim(); speichern(); });
  alle('input[name="theme"]',function(r){ r.addEventListener("change",function(){ e.theme=r.value; fertig(); }); });

  g("expJson").addEventListener("click",jsonExport);
  g("impJson").addEventListener("click",function(){ g("impFile").click(); });
  g("impFile").addEventListener("change",jsonImport);
  g("expCsv").addEventListener("click",csvExport);
  g("druck").addEventListener("click",function(){
    ansicht.reiter="monat"; location.hash="#/info";
    setTimeout(function(){ window.print(); },300);
  });
  g("loeschAlles").addEventListener("click",function(){
    if(!window.confirm("Wirklich ALLE Buchungen und Einstellungen löschen? Das lässt sich nicht rückgängig machen.")) return;
    if(!window.confirm("Letzte Rückfrage: Der gesamte Datenbestand wird gelöscht. Fortfahren?")) return;
    state=leererState();
    try{ window.localStorage.removeItem(KEY); }catch(err){}
    speichern(); themeAnwenden(); zeichneEinstellungen();
  });
}

function download(name,inhalt,typ){
  var b=new Blob([inhalt],{type:typ||"application/octet-stream"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.parentNode.removeChild(a); },800);
}
function jsonExport(){

function jsonImport(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  var box=document.getElementById("impVorschau");
  var leser=new FileReader();
  leser.onload=function(){
    var p=null;
    try{ p=JSON.parse(leser.result); }
    catch(err){
      box.innerHTML='<ul class="hinweise" style="margin-top:12px"><li class="w"><span class="sym">!</span><span>Die Datei ist kein gültiges JSON.</span></li></ul>';
      return;
    }
    if(!p||typeof p!=="object"||!p.tage){
      box.innerHTML='<ul class="hinweise" style="margin-top:12px"><li class="w"><span class="sym">!</span><span>Die Datei enthält keinen Zeiterfassungs-Bestand.</span></li></ul>';
      return;
    }
    var keys=Object.keys(p.tage).sort(), n=keys.length;
    box.innerHTML='<div class="karte pad" style="margin-top:12px;background:var(--surface2)">'
      +'<div class="label">Vorschau des Imports</div>'
      +'<p style="margin:0 0 6px">Die Datei <strong>'+esc(f.name)+'</strong> enthält <strong>'+n+'</strong> Tage'
      +(n?' ('+esc(fmtDatum(keys[0]))+' bis '+esc(fmtDatum(keys[n-1]))+')':'')
      +(p.einstellungen?' und ein vollständiges Einstellungsprofil':'')+'.</p>'
      +'<p class="hint">Der Import <strong>überschreibt</strong> den aktuellen Bestand ('+Object.keys(state.tage).length+' Tage) vollständig.</p>'
      +'<div class="knopfreihe" style="margin-top:10px"><button class="btn prim" id="impOk">Jetzt überschreiben</button>'
      +'<button class="btn" id="impAbbruch">Abbrechen</button></div></div>';
    document.getElementById("impOk").addEventListener("click",function(){
      if(!window.confirm("Aktuellen Bestand durch die Importdatei ersetzen?")) return;
      var s=leererState();
      s.tage=p.tage||{};
      var std=standardEinstellungen();
      for(var k in std) if(p.einstellungen&&p.einstellungen[k]!==undefined) std[k]=p.einstellungen[k];
      s.einstellungen=std;
      state=s; speichern(); themeAnwenden(); zeichneEinstellungen();
      window.alert("Import abgeschlossen: "+n+" Tage übernommen.");
    });
    document.getElementById("impAbbruch").addEventListener("click",function(){ box.innerHTML=""; });
  };
  leser.readAsText(f);
  ev.target.value="";
}

  var zeilen=[["Datum","Tag","Art","Kommen","Gehen","Pausen","Pause h","Dienstgaenge","Dienstgang h","Brutto","Abzug","gekappt","Ist","Soll","Saldo","Korrekturen","Notiz"].map(q).join(sep)];
  b.tage.forEach(function(r){

    zeilen.push([

      q(r.kommen!==null?fmtUhr(r.kommen):""), q(r.gehen!==null?fmtUhr(r.gehen):""),
      q(r.pausen.map(function(x){return fmtUhr(x.a)+"-"+fmtUhr(x.b);}).join(" / ")), q(fmtDauer(r.gebuchtePause)),
      q(r.dienstgaenge.map(function(x){return fmtUhr(x.a)+"-"+fmtUhr(x.b);}).join(" / ")), q(fmtDauer(r.dienstgangSumme)),
      q(fmtDauer(r.brutto)), q(fmtDauer(r.abzug)), q(fmtDauer(r.gekappt)),
      q(fmtDauer(r.ist)), q(fmtDauer(r.soll)), q(fmtSaldo(r.saldo)),

      q(t.notiz||"")
    ].join(sep));
  });
  zeilen.push("");
  zeilen.push([q("Summe Monat"),q(""),q(""),q(""),q(""),q(""),q(fmtDauer(b.pause)),q(""),q(fmtDauer(b.dienstgang)),
    q(""),q(""),q(""),q(fmtDauer(b.ist)),q(fmtDauer(b.soll)),q(fmtSaldo(b.saldo)),q(""),q("")].join(sep));
  zeilen.push([q("Kontostand am Monatsende"),q(fmtSaldo(kontostandBis(letzterTagKey())))].join(sep));
  download("zeiterfassung-"+ansicht.jahr+"-"+pad2(ansicht.monat+1)+".csv","﻿"+zeilen.join("\r\n"),"text/csv;charset=utf-8");

function themeAnwenden(){
  var t=E().theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  var dunkel = t==="dunkel" || (t==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", dunkel?"#070b13":"#eef1f7");
}
document.getElementById("themeBtn").addEventListener("click",function(){
  var e=E();
  var dunkelJetzt = e.theme==="dunkel" || (e.theme==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  e.theme = dunkelJetzt?"hell":"dunkel";
  speichern(); themeAnwenden();

});

function iconDataUrl(px){
  try{
    var c=document.createElement("canvas"); c.width=px; c.height=px;
    var x=c.getContext("2d"); if(!x) return null;
    var r=px*0.22;
    x.fillStyle="#4f6ef7";
    x.beginPath();
    if(x.roundRect) x.roundRect(0,0,px,px,r);
    else { x.moveTo(r,0); x.arcTo(px,0,px,px,r); x.arcTo(px,px,0,px,r); x.arcTo(0,px,0,0,r); x.arcTo(0,0,px,0,r); }
    x.closePath(); x.fill();
    x.strokeStyle="#ffffff"; x.lineCap="round"; x.lineJoin="round"; x.lineWidth=px*0.055;
    x.beginPath(); x.arc(px/2,px/2,px*0.29,0,Math.PI*2); x.stroke();
    x.beginPath(); x.moveTo(px/2,px*0.30); x.lineTo(px/2,px*0.52); x.lineTo(px*0.665,px*0.60); x.stroke();
    return c.toDataURL("image/png");
  }catch(err){ return null; }
}
function pwaEinrichten(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#4f6ef7"/><circle cx="256" cy="256" r="148" fill="none" stroke="#fff" stroke-width="28"/><path d="M256 154v112l84 42" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var svgUrl="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  var icons=[{src:svgUrl,sizes:"any",type:"image/svg+xml",purpose:"any"}];
  var png512=iconDataUrl(512);
  if(png512) icons.push({src:png512,sizes:"512x512",type:"image/png",purpose:"any maskable"});
  var manifest={
    name:"Zeiterfassung", short_name:"Zeiten",
    description:"Private Parallelaufzeichnung der Arbeitszeit",
    start_url:".", scope:".", display:"standalone", orientation:"any",
    background_color:"#070b13", theme_color:"#4f6ef7", lang:"de", icons:icons
  };
  try{
    var blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    var l=document.createElement("link"); l.rel="manifest"; l.href=URL.createObjectURL(blob);
    document.head.appendChild(l);
  }catch(err){}
  var ap=document.createElement("link"); ap.rel="apple-touch-icon"; ap.href=iconDataUrl(180)||svgUrl;
  document.head.appendChild(ap);
  var fav=document.createElement("link"); fav.rel="icon"; fav.type="image/svg+xml"; fav.href=svgUrl;
  document.head.appendChild(fav);
}
